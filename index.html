 back(){if(S.screen==='home'){S.screen='app';S.overlay=null;render();return}if(S.screen==='kd'){A.kback();return}if(S.screen==='fsum'&&S.fview!=null){A.fback();return}if(S.screen==='content'){const f=S.from;S.screen=f==='timer'?'timer':f;if(f==='home'&&S.retTodo){S.overlay='todo';S.retTodo=false}if(f==='timer'){S.running=true;S.lastTs=Date.now()}render()}},
 menu(){S.overlay='menu';render()},
 sc(v){scenario(v);toast('시작 상태를 바꿨어요')},
 fast(){FAST=!FAST;try{localStorage.setItem('chaekbeot-fast',FAST?'1':'0')}catch(e){}render()},
 kf(v){S.kf=v;render()},
 kd(v){S.kFrom=S.screen==='app'?'app':'home';S.kid=v;S.screen='kd';if(S.kstage)delete S.kstage[v];render();const nl=newTitles(false);if(nl.length){titlePop(nl);render()}},
 kst(v){if(!S.kstage)S.kstage={};S.kstage[S.kid]=+v;render()},
 kback(){if(S.kFrom==='app'){S.kFrom=null;S.screen='app';render();return}S.screen='home';S.tab='know';render()},
 spoilst(v,el){S.spoil={t:'다음 변화',ch:el.dataset.ch,p:el.dataset.p,st:v};S.overlay='spoil';render()},
 hint(v){S.hintMode=v;S.overlay=null;render();toast('힌트 방식을 바꿨어요')},
 tab(v){S.tab=v;if(v==='know')KNOW.filter(knowOpen).forEach(k=>S.seenKnow.add('_v'+k.t));render()},
 ptab(v){S.ptab=v;render()},
 pl(v){S.pl=+v;S.overlay=null;render();toast('문구를 바꿨어요')},
 start(){if(!S.log.some(l=>l.type==='start'&&(l.round||1)===S.round))S.log.push({d:TODAY,type:'start',round:S.round});startTimer()},
 trailer(){S.screen='trailer';S.tend=false;render();clearTimeout(window.__tr);window.__tr=setTimeout(()=>{if(S.screen==='trailer'){S.tend=true;render()}},6000)},
 tskip(){clearTimeout(window.__tr);S.tend=true;render()},
 tclose(){clearTimeout(window.__tr);S.screen='home';render()},
 tstart(){clearTimeout(window.__tr);S.screen='home';A.start()},
 revpost2(){const t=document.getElementById('revtxt').value.trim();if(!t)return;S.reviews.unshift({n:'나',p:TOTAL,t,mine:true});S.revDone=t;render();toast('감상을 남겼어요')},
 praise(){if(!S.revDone){const t=document.getElementById('revtxt');S.revDraft=t?t.value:'';S.overlay='revask';render();return}S.revDone=null;A.gohome();toast('완독을 축하해요!')},
 revaskpost(){const t=document.getElementById('revtxt3').value.trim();if(!t){document.getElementById('err3').textContent='감상을 적어 주세요';return}S.reviews.unshift({n:'나',p:TOTAL,t,mine:true});S.revDone=null;S.revDraft='';S.overlay=null;A.gohome();toast('감상을 남기고 완독을 마쳤어요!')},
 revasklater(){S.revDone=null;S.revDraft='';S.overlay=null;A.gohome();toast('완독을 축하해요!')},
 recap(){S.from='fsum';S.cid='recap';S.screen='content';render()},
 gsel(v){S.gsel=+v;render()},
 goalok(){S.goal=addD(S.gsel);S.log.push({d:TODAY,type:'start',goal:S.goal,round:1});startTimer()},
 goalskip(){S.log.push({d:TODAY,type:'start',goal:null,round:1});startTimer()},
 reread(){S.round=S.completions.length+1;S.page=0;S.log.push({d:TODAY,type:'start',round:S.round});startTimer()},
 pull(){S.pull=true;render()},unpull(){S.pull=false;render()},
 pause(){S.running=false;S.lastTs=null;render()},
 resume(){S.overlay=null;S.running=true;S.lastTs=Date.now();render()},
 stop(){S.overlay='endpage';render()},
 endday(){const v=readPage();if(v===null)return;if(v<S.page){S.pend={to:v,sec:S.timer,timer:true};S.overlay='back';render();return}commit(v,S.timer)},
 pagesave(){const v=readPage();if(v===null)return;const d=addD(parseInt(document.getElementById('dsel').value,10));S.sessionFrom=S.page;if(v<S.page){S.pend={to:v,sec:null,d};S.overlay='back';render();return}commit(v,null,d)},
 backok(){const p=S.pend;commit(p.to,p.sec,p.d)},
 backno(){S.overlay=S.pend&&S.pend.timer?'endpage':'pageonly';S.pend=null;render()},
 content(v){S.retTodo=S.overlay==='todo';S.from=S.screen==='timer'?'timer':S.screen;if(S.from==='timer'){S.running=false}S.cid=v;S.screen='content';S.overlay=null;render()},
 cdone(){A._cdone();const nl=newTitles(false);if(nl.length){titlePop(nl);render()}},
 _cdone(){if(!S.done.has(S.cid))S.log.push({d:TODAY,type:'content',id:S.cid});S.done.add(S.cid);const f=S.from;if(f==='timer'){S.screen='timer';S.pull=false;S.running=true;render();toast('타이머가 다시 돌아요')}else if(f==='home'){S.screen='home';if(S.retTodo&&todoList().length)S.overlay='todo';S.retTodo=false;render()}else{S.screen=f;render()}},
 gohome(){S.screen='home';S.tab='timeline';S.sessionFrom=null;render()},
 fsum(){S.fview=null;S.screen='fsum';render()},
 tlday(v){if(!(S.tlOpen instanceof Set))S.tlOpen=new Set();S.tlOpen.has(v)?S.tlOpen.delete(v):S.tlOpen.add(v);render()},
 tlsum(v){S.fview=+v;S.screen='fsum';render()},
 fback(){S.fview=null;S.screen='home';S.tab='timeline';render()},
 saverev(){const t=document.getElementById('revtxt').value.trim();if(t)S.reviews.unshift({n:'나',p:TOTAL,t,mine:true});A.gohome();if(t)toast('감상을 남겼어요')},
 revpost(){const t=document.getElementById('revtxt2').value.trim();if(!t)return;S.reviews.unshift({n:'나',p:S.page,t,mine:true});S.overlay=null;render();toast('감상을 올렸어요')},
 spoil(v,el){S.spoil={t:v,ch:el.dataset.ch,p:el.dataset.p};S.overlay='spoil';render()},
 spoilok(){if(S.spoil.st){if(!(S.peek instanceof Set))S.peek=new Set();S.peek.add(S.spoil.st);if(S.kstage)delete S.kstage[S.kid]}else S.seenKnow.add(S.spoil.t);S.overlay=null;render()},
 spoilrev(v){S.reviews[+v].shown=true;render()},
 ov(v){S.sessionFrom=S.page;S.overlay=v;render()},
 close(){S.overlay=null;render()},
 rnext(){S.rstep=2;render()},
 rclose(){if(S.overlay!=='reward')return;S.overlay=null;S.rstep=1;render()},
 rpick(v){S.overlay=null;S.rstep=1;S.from='fsum';S.cid=v;S.screen='content';render()},
 tclose2(){const l=(S.tpop||[]).slice(1);if(l.length){S.tpop=l}else{S.overlay=null;S.tpop=null}render()},
 rep(v){S.repTitle=v;render();toast('대표 칭호를 바꿨어요')},
 pick(v){const [id,sh]=v.split(':');choices()[id]=sh;A.cdone()}
};
function bind(P){P.querySelectorAll('[data-a]').forEach(el=>{const go=e=>{e.preventDefault();A[el.dataset.a](el.dataset.v,el)};el.addEventListener('click',go);if(el.getAttribute('role')==='button')el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go(e)})});
  const qi=document.getElementById('qin');if(qi){qi.addEventListener('input',()=>{S.q=qi.value;clearTimeout(window.__q);window.__q=setTimeout(()=>{const p=qi.selectionStart;render();const n=document.getElementById('qin');if(n){n.focus();n.setSelectionRange(p,p)}},250)})}
  const pk=document.getElementById('peek');if(pk){let y0=null;pk.addEventListener('pointerdown',e=>{y0=e.clientY});pk.addEventListener('pointerup',e=>{if(y0!==null&&y0-e.clientY>20){A.pull()}y0=null})}}
function save(){try{localStorage.setItem('chaekbeot-proto-v3',JSON.stringify(S,(k,v)=>v instanceof Set?{__set:[...v]}:(k==='toast'||k==='_scrolled'||k==='_sk'||k==='tlOpen'||k==='tlAuto'||k==='tlLatest')?undefined:v))}catch(e){}}
function load(){try{const t=localStorage.getItem('chaekbeot-proto-v3');if(!t)return null;return JSON.parse(t,(k,v)=>v&&v.__set?new Set(v.__set):(typeof v==='string'&&/^\d{4}-\d\d-\d\dT/.test(v))?new Date(v):v)}catch(e){return null}}
(function init(){try{localStorage.removeItem('chaekbeot-proto')}catch(e){}const s=load();if(s&&s.screen){S=s;if(!S.at||S.at==='my'||S.at==='set')S.at='home';S.lsel=null;S.lpile=0;if(S.screen!=='timer'){S.screen='app';S.overlay=null}S.toast=null;render();if(S.screen==='timer')startTick()}else scenario('mid')})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&S.running){const el=document.getElementById('clk');if(el)el.textContent=clock(S.timer)}});
</script>

</body></html>
