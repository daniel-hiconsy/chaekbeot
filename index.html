<style>
/* Layout: a single phone-width column (max 480px) with a fixed bottom tab bar; sheets slide up over the column. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#e9ebf1; --line:#d9dce5;
  --fg:#1b1d24; --sub:#666a78; --faint:#9a9eab;
  --accent:#2b56d6; --accent-soft:#e3e9fb; --on-accent:#ffffff;
  --good:#1f7a4a; --good-soft:#e2f3e9; --warn:#a85a10; --warn-soft:#fbeedd;
  --dim:rgba(20,22,30,.45);
  --serif:"Gowun Batang","Apple SD Gothic Neo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13151b; --surface:#1c1f27; --sunk:#262a34; --line:#323745;
  --fg:#eceef3; --sub:#a4a9b8; --faint:#6f7484;
  --accent:#7b9bff; --accent-soft:#25304f; --on-accent:#0f1530;
  --good:#5fd09a; --good-soft:#18352a; --warn:#f0a660; --warn-soft:#3a2a17;
  --dim:rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#13151b; --surface:#1c1f27; --sunk:#262a34; --line:#323745;
  --fg:#eceef3; --sub:#a4a9b8; --faint:#6f7484;
  --accent:#7b9bff; --accent-soft:#25304f; --on-accent:#0f1530;
  --good:#5fd09a; --good-soft:#18352a; --warn:#f0a660; --warn-soft:#3a2a17;
  --dim:rgba(0,0,0,.6); color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;font-size:24px;line-height:1;padding:6px 8px 6px 0;color:var(--fg)}
.main{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:8px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main.notab{padding-bottom:32px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.soft{background:var(--accent-soft);border-color:transparent}
.plain{background:var(--sunk);border-color:transparent}
.row{display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.grow{flex:1;min-width:0}
.h2{font-size:17px;font-weight:700;margin:0}
.h3{font-size:15px;font-weight:700;margin:0}
.serif{font-family:var(--serif)}
.small{font-size:12.5px;color:var(--sub)}
.tiny{font-size:11.5px;color:var(--faint)}
.sub{color:var(--sub)}
.acc{color:var(--accent)}
.goodc{color:var(--good)}
.num{font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);width:100%}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--accent);padding:8px 0;font-weight:500;width:auto}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700;background:var(--warn-soft);color:var(--warn);vertical-align:middle;letter-spacing:.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.track{height:7px;border-radius:7px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:7px}
.cover{flex:none;border-radius:6px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-family:var(--serif);font-weight:700;line-height:1.25;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-size:16px}
textarea{min-height:84px;resize:vertical}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;text-align:left;width:100%;font-size:15px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{opacity:.55}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--dim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
.clock{width:236px;height:236px;border-radius:50%;border:10px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:12px auto 4px}
.clock b{font-size:46px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.switch{width:50px;height:30px;border-radius:30px;background:var(--line);border:0;position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:110px;gap:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:70%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}
.bars .b i.zero{background:var(--line)}
.bars .b i.today{outline:2px dashed var(--accent);outline-offset:2px}
.shelf{background:var(--sunk);border-radius:var(--r);padding:14px 14px 0;display:flex;flex-direction:column}
.shelf-row{display:flex;align-items:flex-end;gap:8px;min-height:132px;padding-bottom:0;flex-wrap:wrap}
.plank{height:8px;background:var(--line);border-radius:3px;margin:0 -6px 14px}
.slot{width:22px;height:110px;border-radius:3px;border:1px dashed var(--line)}
.bookcard{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:5px;aspect-ratio:3/4.3;max-width:100%;border:1.5px solid}
.bookcard .art{flex:1;border-radius:7px;display:flex;align-items:center;justify-content:center;min-height:0}
.bookcard.locked{border:1px dashed var(--line);background:var(--surface);align-items:center;justify-content:center;text-align:center;color:var(--faint)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:11.5px;color:var(--sub)}
.badge i{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:700;font-size:13px;border:1.5px solid var(--accent)}
.badge.off i{background:none;border:1.5px dashed var(--line);color:var(--faint)}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-weight:500;color:var(--sub);font-size:14px}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat>div{background:var(--sunk);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:0 10px 10px 0;padding:10px 12px;font-size:12.5px}
.hero{padding:40px 0 10px;display:flex;flex-direction:column;gap:12px}
.hero .logo{font-family:var(--serif);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px}
.stepper input{width:110px;text-align:center;font-size:26px;font-weight:700}
.hr{height:1px;background:var(--line)}
.cover{font-family:var(--serif)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;flex:none;color:var(--sub)}
.search input{border:0!important;padding:12px 0!important;background:none!important;outline:none}
.banner{border:0;border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;background:linear-gradient(120deg,var(--accent),#6a4fd6);color:#fff;width:100%}
.banner .covers{display:flex;flex:none}
.banner .covers>*{margin-left:-14px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.banner .covers>*:first-child{margin-left:0}
.cardbtn{border:0;padding:0;background:none;width:100%;display:block;text-align:left}
.cf,.cb{position:relative;overflow:hidden;border-radius:14px;background:var(--cbg);color:var(--ink);border:2px solid var(--ink);display:flex;flex-direction:column;gap:5px;padding:9px;aspect-ratio:3/4.3;width:100%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.cf-top{display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.04em}
.cf-art{flex:1;min-height:0;border-radius:8px;overflow:hidden;border:1.5px solid var(--ink)}
.cf-art svg{display:block}
.cf-name{font-weight:700;font-size:15px;line-height:1.15}
.cf-sub{font-size:10px;opacity:.8}
.cf-title{font-size:10px;font-weight:700;background:rgba(255,255,255,.7);border-radius:999px;padding:2px 8px;align-self:flex-start}
.cf.quiet,.cb.quiet{filter:saturate(.2)}
.flip{perspective:1200px;width:min(74vw,290px);margin:0 auto;cursor:pointer}
.flip-in{position:relative;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;aspect-ratio:3/4.3}
.flip-in.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.flip .cf,.flip .cb{height:100%;padding:16px;gap:9px;border-width:3px}
.flip .cf-top{font-size:12px}.flip .cf-name{font-size:28px}.flip .cf-sub,.flip .cf-title{font-size:13px}
.cb-body{flex:1;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.6);border-radius:10px;padding:14px;min-height:0;overflow:auto}
.cb-l{font-size:11px;font-weight:700;letter-spacing:.05em;opacity:.75}
.cb-q{margin:0 0 8px;font-size:18px;line-height:1.45}
.cb-s{margin:0;font-size:14px}
.shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);transform:translateX(-120%)}
.modal-wrap{position:fixed;inset:0;z-index:25;background:rgba(10,12,18,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));color:#fff;overflow:auto}
.modal-wrap .mtxt{text-align:center;display:flex;flex-direction:column;gap:4px;max-width:340px}
.modal-wrap .mtxt b{font-size:20px}
.modal-wrap .mtxt span{font-size:13px;opacity:.8}
.modal-wrap .btn{max-width:340px}
.medal{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;color:#2a2205;background:radial-gradient(circle at 35% 30%,#fff6c8,#f2c94c 45%,#c9962a 100%);box-shadow:0 0 0 6px rgba(242,201,76,.35),0 0 60px rgba(242,201,76,.55);position:relative}
.medal::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:2px solid rgba(242,201,76,.6)}
.medal.small{width:64px;height:64px;font-size:13px;box-shadow:0 0 0 4px rgba(242,201,76,.3)}
.medal.small::after{display:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:26}
@media (prefers-reduced-motion:no-preference){
 .reveal .flip-in{animation:cardIn 1.1s cubic-bezier(.2,.7,.2,1) both}
 @keyframes cardIn{0%{transform:rotateY(180deg) scale(.4);opacity:0}55%{transform:rotateY(0) scale(1.08);opacity:1}100%{transform:rotateY(0) scale(1)}}
 .reveal .shine{animation:shine 1.6s .9s ease-out both}
 @keyframes shine{to{transform:translateX(120%)}}
 .quietin .flip-in{animation:qin 2.2s ease-out both}
 @keyframes qin{from{opacity:0;transform:translateY(12px)}}
 .pop{animation:pop .7s cubic-bezier(.2,.8,.2,1.2) both}
 @keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
 .medal::after{animation:ring 1.4s ease-out .3s both}
 @keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
 .rise{animation:rise .6s ease-out both}
 @keyframes rise{from{opacity:0;transform:translateY(14px)}}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<script>
(function(){
"use strict";
/* ---------- 데이터 (예시) ---------- */
const BOOKS=[

function now(){return new Date(Date.now()+S.dayOffset*864e5);}
function dk(d){d=d||now();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(key,n){const [y,m,d]=key.split('-').map(Number);const t=new Date(y,m-1,d+n);return dk(t);}
function diffDays(a,b){const p=k=>{const [y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d);};return Math.round((p(b)-p(a))/864e5);}
function fmtDate(key){const [,m,d]=key.split('-').map(Number);return m+'월 '+d+'일';}
function bs(id){if(!S.books[id])S.books[id]={status:'none',checkins:[],pages:[],contents:[],mission:{},inputs:{},games:{},quiz:{},chapter:0,lastPage:0,goalChanges:0};return S.books[id];}
function reading(){return BOOKS.filter(b=>bs(b.id).status==='reading');}
function allContents(b){const o=[];Object.keys(b.contents).forEach(c=>b.contents[c].forEach(x=>o.push(Object.assign({ch:+c},x))));return o;}
function openContents(b){const st=bs(b.id);return allContents(b).filter(x=>x.ch<=st.chapter);}
function activityDays(){const s=new Set();Object.values(S.books).forEach(st=>{(st.checkins||[]).forEach(c=>s.add(c.date));(st.pages||[]).forEach(p=>s.add(p.date));});S.sessions.forEach(x=>s.add(x.date));return s;}
function streak(){const s=activityDays();let k=dk();if(!s.has(k))k=addDays(k,-1);let n=0;while(s.has(k)){n++;k=addDays(k,-1);}return n;}
function minutesOn(key){return S.sessions.filter(x=>x.date===key).reduce((a,x)=>a+x.min,0);}
function missionDone(b,m){const st=bs(b.id);if(m.type==='count')return (st.mission[m.id]||0)>=m.goal;if(m.type==='chapter'||m.type==='input'||m.type==='review')return !!st.mission[m.id];if(m.type==='allContents'){const all=allContents(b);return all.length>0&&all.every(x=>st.contents.includes(x.key));}return false;}
function missionCount(b){return b.missions.filter(m=>missionDone(b,m)).length;}
function chapterForPage(b,p){for(let i=0;i<b.pageEnds.length;i++){if(p<=b.pageEnds[i])return p===b.pageEnds[i]?i+1:i;}return b.chapters.length;}

 const lit=done.filter(b=>b.genre==='문학').length,non=done.filter(b=>b.genre==='비문학').length;
 if(lit>=2)give('story2');if(non>=2)give('know2');if(lit>=1&&non>=1)give('both');
 done.forEach(b=>{if(BADGES.find(x=>x.id==='topic_'+b.topic))give('topic_'+b.topic);});
 const st=streak();if(st>=3)give('streak3');if(st>=7)give('streak7');
 BOOKS.forEach(b=>{const all=allContents(b);if(all.length&&all.every(x=>bs(b.id).contents.includes(x.key)))give('explorer');});
 if(S.reviews>=3)give('review3');
 return got.filter(Boolean);}

 if(!sheet&&ui.badgeQ&&ui.badgeQ.length&&!['reward','quiz','onboard'].includes(route.n))sheet={n:'badgeview',ids:ui.badgeQ.splice(0)};

}

  if(b.missions.length)h+=`<div class="card soft"><div class="row between"><b class="acc small">이 책의 미션</b><b class="acc small">${missionCount(b)} / ${b.missions.length} 완료</b></div>${b.missions.map(m=>{const d=missionDone(b,m);const p=m.type==='count'?` ${Math.min(st.mission[m.id]||0,m.goal)} / ${m.goal}`:'';return `<div class="row between"><div class="col" style="gap:0"><b>${esc(m.name)}</b><span class="small">${esc(m.desc)}</span></div><span class="small ${d?'goodc':''}" style="white-space:nowrap">${d?'완료':p||'진행 중'}</span></div>`;}).join('')}</div>`;
  if(b.before)h+=`<button class="card row" style="text-align:left" data-a="before" data-v="${b.id}"><b class="grow">읽기 전에 · 배경과 낱말</b><span class="sub">›</span></button>`;
  if(Object.keys(b.contents).length){h+=`<b class="h3">열린 콘텐츠 ${oc.length} / ${allContents(b).length}</b>`;
   h+=oc.length?`<div class="cards" style="grid-template-columns:repeat(2,1fr)">${oc.map(x=>`<button class="card plain" style="text-align:left;gap:4px" data-a="content" data-v="${b.id}" data-w="${x.key}"><span class="tiny">${esc(b.chapters[x.ch-1])}${st.contents.includes(x.key)?' · 봤어요':''}</span><b>${esc(x.title)}</b><span class="small">${esc(x.sub)}</span></button>`).join('')}</div>`:`<p class="small" style="margin:0">첫 장을 체크인하면 콘텐츠가 열려요.</p>`;
   if(next)h+=`<div class="card row" style="border-style:dashed"><span class="small grow">${esc(b.chapters[next.ch-1])}까지 체크인하면 「${esc(next.title)}」이 열려요</span></div>`;}
  else h+=`<div class="note">콘텐츠가 없는 책이에요. 체크인과 기록만 남아요.</div>`;
  if(st.status==='reading')h+=`<button class="btn" data-a="timerstart" data-v="${b.id}">이어서 읽기 (타이머)</button><button class="btn sec" data-a="checkin" data-v="${b.id}">읽은 곳 체크인</button>`;
  else if(st.status==='done'&&!st.confirmed)h+=`<button class="btn" data-a="go" data-v="review" data-w="${b.id}">한 줄 감상 남기고 ${b.card?'카드 받기':'완독 확인하기'}</button>`;
  return shell(esc(b.title),h,{back:true,tabs:false});},

 before(){const b=B(route.id);const x=b.before;
  return shell('읽기 전에',`<div class="card"><b class="h3">이 책은</b><p style="margin:0">${esc(b.intro)}</p></div>
   <div class="card soft"><b class="h3 acc">알고 읽으면 재밌어요</b>${x.bg.map(t=>`<p style="margin:0">· ${esc(t)}</p>`).join('')}</div>
   <div class="card"><b class="h3">낱말</b>${x.words.map(([w,d])=>`<div class="col" style="gap:0"><b>${esc(w)}</b><span class="small">${esc(d)}</span></div>`).join('')}</div>
   <button class="btn" data-a="back">책 읽으러 가기</button>`,{back:true,tabs:false});},

 checkin(){const b=B(route.id);const st=bs(b.id);const tot=b.chapters.length;const sel=Math.min(tot,Math.max(ui.ckCh||0,st.chapter+1));
  return shell('체크인',`<div class="col"><b class="h2">${esc(b.title)}, 어디까지 읽었나요?</b><span class="small">지금까지 ${st.chapter}장. 끝까지 읽은 장을 골라 주세요.</span></div>
   <div class="chips">${b.chapters.map((c,i)=>{const n=i+1;const dis=n<=st.chapter;return `<button class="chip ${sel===n?'on':''}" data-a="ckch" data-v="${n}" ${dis?'disabled style="opacity:.35"':''}>${esc(c)}</button>`;}).join('')}</div>
   ${sel===tot?'<div class="card soft"><b class="acc">마지막 장이에요. 체크인하면 완독으로 표시돼요.</b></div>':''}
   <div class="col"><label class="small" for="ckp">마지막으로 읽은 쪽 (선택)</label><input id="ckp" type="number" inputmode="numeric" placeholder="${b.pageEnds[sel-1]}"></div>
   <div class="col"><label class="small" for="ckn">한 줄 소감 (선택)</label><input id="ckn" type="text" maxlength="60" placeholder="떠오른 키워드나 한 줄"></div>
   <button class="btn" data-a="cksave" data-v="${b.id}">체크인</button>`,{back:true,tabs:false});},

 quiz(){const b=B(route.id);const qs=b.quiz[route.ch]||[];const i=route.i||0;const q=qs[i];const pick=ui.qpick;const shown=ui.qshown;
  return shell('챕터 퀴즈',`<div class="row between"><span class="pill">${esc(b.chapters[route.ch-1])}</span><span class="small num">${i+1} / ${qs.length}</span></div>
   <b class="h2">${esc(q.q)}</b><div class="col">${q.o.map((o,k)=>{let c='';if(shown){c=k===q.a?'right':(k===pick?'wrong':'');}else if(pick===k)c='sel';return `<button class="opt ${c}" data-a="qpick" data-v="${k}" ${shown?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>
   ${shown?`<div class="card plain"><b>${pick===q.a?'맞았어요':'정답은 「'+esc(q.o[q.a])+'」'}</b><span class="small">책에서는 이렇게 나와요 · ${esc(q.w)}를 다시 펼쳐 보세요</span></div><button class="btn" data-a="qnext">${i+1<qs.length?'다음 문제':'퀴즈 마치기'}</button>`:`<button class="btn" data-a="qshow" ${pick==null?'disabled':''}>정답 보기</button>`}
   <span class="tiny">퀴즈 결과는 다 읽은 뒤 한 번에 모아서 보여 줘요.</span>`,{back:false,tabs:false});},

 ckdone(){const b=B(route.id);const st=bs(b.id);const opened=allContents(b).filter(x=>x.ch>route.from&&x.ch<=st.chapter);const last=st.chapter===b.chapters.length;
  return shell('체크인 완료',`<div class="card soft" style="align-items:flex-start"><span class="pill">${esc(b.chapters[st.chapter-1])}까지</span><b class="h2">${last?'마지막 장까지 읽었어요':'잘 읽고 있어요'}</b><span class="small">연속 ${streak()}일째 기록 중${b.missions.length?' · 미션 '+missionCount(b)+' / '+b.missions.length:''}</span></div>
   ${opened.length?`<b class="h3">새로 열린 콘텐츠</b>${opened.map(x=>`<button class="card row" style="text-align:left" data-a="content" data-v="${b.id}" data-w="${x.key}"><div class="col grow" style="gap:0"><span class="tiny">${esc(b.chapters[x.ch-1])}</span><b>${esc(x.title)}</b><span class="small">${esc(x.sub)}</span></div><span class="sub">›</span></button>`).join('')}`:(Object.keys(b.contents).length?'<p class="small">이번 장에는 새 콘텐츠가 없어요.</p>':'')}
   ${last?`<button class="btn" data-a="go" data-v="finish" data-w="${b.id}">완독 기록 보기</button>`:`<button class="btn" data-a="tab" data-v="home">홈으로</button>`}`,{back:false,tabs:false});},

 content(){const b=B(route.id);const x=allContents(b).find(c=>c.key===route.key);const st=bs(b.id);
  let body='';
  if(x.type==='people'||x.type==='note')body=`<div class="card">${x.items.map(([a,d])=>`<div class="col" style="gap:0"><b>${esc(a)}</b><span class="small">${esc(d)}</span></div>`).join('<div class="hr"></div>')}</div>`;
  if(x.type==='game'){const done=st.games[x.key];const pick=ui.gpick;body=`<div class="card soft"><span class="tiny acc">미션 · ${esc((b.missions.find(m=>m.id===x.mission)||{}).name||'')}</span><b class="h3">${esc(x.q)}</b></div><div class="col">${x.opts.map((o,k)=>{let c='';if(done!=null||ui.gshown){c=k===x.a?'right':(k===pick?'wrong':'');}else if(pick===k)c='sel';return `<button class="opt ${c}" data-a="gpick" data-v="${k}" ${done!=null||ui.gshown?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>${done!=null||ui.gshown?`<div class="card plain"><b>${(done!=null?done:pick===x.a)?'찾았어요! 미션에 반영됐어요':'아쉬워요. 정답을 확인해 보세요'}</b></div>`:`<button class="btn" data-a="gcheck" ${pick==null?'disabled':''}>확인</button>`}`;}
  if(x.type==='input'){const v=st.inputs[x.key]||'';body=`<div class="card soft"><span class="tiny acc">미션 · ${esc((b.missions.find(m=>m.id===x.mission)||{}).name||'')}</span><b class="h3">${esc(x.q)}</b></div><textarea id="cin" maxlength="300" placeholder="내 생각을 적어 보세요">${esc(v)}</textarea><button class="btn" data-a="csave" data-v="${b.id}" data-w="${x.key}">${v?'다시 저장':'저장'}</button>`;}
  return shell(esc(x.title),`<div class="col" style="gap:0"><span class="tiny">${esc(b.title)} · ${esc(b.chapters[x.ch-1])}</span><b class="h2">${esc(x.title)}</b><span class="small">${esc(x.sub)}</span></div>${body}`,{back:true,tabs:false});},

 finish(){const b=B(route.id);const st=bs(b.id);const days=Math.max(1,diffDays(st.started,st.doneDate)+1);const min=S.sessions.filter(s=>s.book===b.id).reduce((a,s)=>a+s.min,0);
  const qa=Object.values(st.quiz);const qt=qa.reduce((a,x)=>a+x.t,0),qc=qa.reduce((a,x)=>a+x.c,0);const q=b.card&&b.card.quiet;
  return shell(q?'다 읽었어요':'완독',`${b.card?`<div style="width:150px;margin:6px auto;position:relative"><div style="filter:grayscale(1) blur(1.5px);opacity:.5">${cardFront(b,'small')}</div><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><span class="pill" style="background:var(--surface)">감상을 남기면 열려요</span></div></div>`:''}
   <div class="col" style="align-items:center;text-align:center"><b class="h2 serif" style="font-size:21px">${q?'「'+esc(b.title)+'」를 끝까지 읽어 주어 고마워요':'「'+esc(b.title)+'」를 다 읽었어요!'}</b>${b.card?`<span class="small" style="color:${b.ink}">한 줄 감상을 남기면 ${q?'기억 카드':'카드'} 「${esc(b.card.name)}」과 칭호 「${esc(b.card.title)}」를 받아요</span>`:'<span class="small">한 줄 감상을 남기면 완독이 확인돼요</span>'}</div>
   <div class="stat"><div><b>${days}일</b><span class="tiny">걸린 날</span></div><div><b>${min?Math.floor(min/60)+'시간 '+min%60+'분':st.checkins.length+'번'}</b><span class="tiny">${min?'읽은 시간':'체크인'}</span></div><div><b>${b.missions.length?missionCount(b)+' / '+b.missions.length:'-'}</b><span class="tiny">미션</span></div></div>
   ${qt?`<div class="card plain row between"><span class="small">챕터 퀴즈 결과 (다 읽은 뒤 모아서)</span><b class="num">${qt}개 중 ${qc}개 맞힘</b></div>`:''}
   ${q?'':`<div class="card" style="background:var(--warn-soft);border-color:transparent"><b class="small">다 읽은 너에게</b><span>${esc(cheer(b))}</span></div>`}
   <button class="btn" data-a="go" data-v="review" data-w="${b.id}">감상 남기기</button><button class="btn sec" data-a="tab" data-v="home">나중에</button>`,{back:false,tabs:false});},

 review(){const b=B(route.id);const st=bs(b.id);const v=ui.rv!=null?ui.rv:'';const sc=ui.rsc;const ok=validLine(v);
  return shell('완독 후 떠들기',`<div class="col"><label class="h3" for="rvl">한 줄 감상 <span class="small">(필수 · 10자 이상)</span></label><textarea id="rvl" maxlength="120" placeholder="책을 덮고 가장 먼저 떠오른 생각">${esc(v)}</textarea><span class="small" id="rvh">${v?(ok?'좋아요':'10자 이상, 같은 글자 반복 없이 써 주세요'):'예: 규칙이 조금씩 바뀌는데 아무도 막지 못하는 게 무서웠다'}</span></div>
   ${b.scenes.length?`<div class="col"><span class="h3">기억에 남는 장면 <span class="small">(선택)</span></span><span class="small">고르면 카드 뒷면에 「나의 장면」으로 새겨져요</span><div class="col">${b.scenes.map((s,i)=>`<button class="opt ${sc===i?'sel':''}" data-a="rsc" data-v="${i}">${esc(s)}</button>`).join('')}</div></div>`:''}
   <button class="btn" id="rvbtn" data-a="rsave" data-v="${b.id}" ${ok?'':'disabled'}>${b.card?'감상 남기고 카드 받기':'감상 남기기'}</button>`,{back:true,tabs:false});},

 reward(){const b=B(route.id);const g=route.badges||[];const q=b.card&&b.card.quiet;
  if(!b.card)return shell('완독 확인',`<div class="card soft rise"><b class="h2">완독이 확인됐어요</b><span class="small">이 책은 카드가 없어요. 서재 책장에 꽂혔어요.</span></div>${g.length?badgeRow(g):''}<button class="btn" data-a="tab" data-v="shelf">내 서재 보기</button>`,{back:false,tabs:false});
  return `<div class="modal-wrap" style="position:relative;min-height:100%;background:${q?'#1c1d22':'radial-gradient(circle at 50% 30%,'+b.ink+' 0%,#12131a 70%)'}">
   <div class="mtxt rise" style="animation-delay:.1s"><span>${q?'기억 카드':'새 카드'}</span><b class="serif" style="font-size:24px">${q?'끝까지 읽어 주어 고마워요':'「'+esc(b.card.name)+'」 카드를 받았어요'}</b></div>
   <div class="${q?'quietin':'reveal'}">${flipCard(b,!!ui.flipped)}</div>
   <div class="mtxt rise" style="animation-delay:1s"><span>카드를 누르면 뒷면에 나의 한 줄과 장면이 있어요</span><span>칭호 「${esc(b.card.title)}」${S.title===b.card.title?'를 쓰고 있어요':'를 받았어요'}</span></div>
   ${g.length?`<div class="row wrap" style="justify-content:center;gap:16px">${g.map((x,i)=>`<div class="col pop" style="align-items:center;animation-delay:${1.3+i*.25}s"><div class="medal small">${esc(x.short)}</div><span style="font-size:12px">${esc(x.name)}</span></div>`).join('')}</div>`:''}
   <button class="btn rise" style="animation-delay:1.5s" data-a="tab" data-v="shelf">서재에 꽂기</button><button class="btn sec rise" style="animation-delay:1.6s;background:transparent;color:#fff;border-color:rgba(255,255,255,.35)" data-a="tab" data-v="books">다음 책 고르기</button></div>`;},

 shelf(){const t=ui.shelfTab||'shelf';const done=BOOKS.filter(b=>bs(b.id).status==='done');
  let h=`<div class="seg"><button class="${t==='shelf'?'on':''}" data-a="st" data-v="shelf">책장</button><button class="${t==='cards'?'on':''}" data-a="st" data-v="cards">카드 · 뱃지</button></div>`;
  if(t==='shelf'){const sel=ui.shelfSel&&done.find(b=>b.id===ui.shelfSel)||done[0];
   h+=`<b class="h3">다 읽은 책 ${done.length}권</b><div class="shelf"><div class="shelf-row">${done.map(b=>`<button style="border:0;padding:0;background:none;outline:${sel===b?'2px solid var(--accent)':'none'};border-radius:6px" data-a="ssel" data-v="${b.id}">${cover(b,74,108)}</button>`).join('')}${Array.from({length:Math.max(0,5-done.length)}).map(()=>'<span class="slot"></span>').join('')}</div><div class="plank"></div></div>`;
   if(sel){const st=bs(sel.id);h+=`<div class="card"><span class="small">${esc(sel.title)} · ${fmtDate(st.doneDate)} 다 읽음${sel.missions.length?' · 미션 '+missionCount(sel)+'/'+sel.missions.length:''}</span>${st.review?`<b class="serif" style="font-size:16px">"${esc(st.review.line)}"</b>`:'<span class="small">아직 한 줄 감상이 없어요</span>'}${st.review&&st.review.scene!=null?`<span class="small">기억에 남는 장면 · ${esc(sel.scenes[st.review.scene])}</span>`:''}${!st.confirmed?`<button class="btn sec" data-a="go" data-v="review" data-w="${sel.id}">한 줄 감상 남기기</button>`:sel.card?`<button class="btn ghost" data-a="st" data-v="cards">받은 카드 「${esc(sel.card.name)}」 보기 ›</button>`:''}</div>`;}
   else h+=`<p class="small">아직 다 읽은 책이 없어요. 첫 책을 끝까지 읽으면 여기에 꽂혀요.</p>`;}
  else{const withCard=BOOKS.filter(b=>b.card);const got=withCard.filter(b=>bs(b.id).cardGot);
   h+=`<div class="row between"><b class="h3">책 카드 ${got.length} / ${withCard.length}</b><span class="small">다 읽은 책마다 한 장</span></div><div class="cards">${withCard.map(b=>bookCard(b,false)).join('')}</div>`;
   h+=S.title?`<div class="card soft"><span class="small acc">지금 쓰는 칭호</span><b class="h2 serif acc">${esc(S.title)}</b>${got.length>1?`<div class="chips">${got.map(b=>`<button class="chip ${S.title===b.card.title?'on':''}" data-a="title" data-v="${esc(b.card.title)}">${esc(b.card.title)}</button>`).join('')}</div>`:''}</div>`:'';
   h+=`<div class="row between"><b class="h3">뱃지 ${Object.keys(S.badges).length}개</b></div><div class="badges">${BADGES.map(x=>`<button class="badge ${S.badges[x.id]?'':'off'}" style="border:0;background:none;padding:0" data-a="binfo" data-v="${x.id}"><i>${esc(x.short)}</i>${esc(x.name)}</button>`).join('')}</div><p class="tiny">뱃지는 무작위 뽑기 · 교환이 없어요. 뱃지를 누르면 받는 조건이 보여요.</p>`;}
  return shell('내 서재',h);},

 my(){const u=S.user;const tm=minutesOn(dk());
  return shell('마이',`<div class="row"><div style="width:52px;height:52px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-weight:700" class="acc">${esc((u.name||'?').slice(0,1))}</div><div class="col grow" style="gap:0"><b class="h2">${esc(u.name)}</b><span class="small">${esc(u.grade)}${S.title?' · 칭호 '+esc(S.title):''}</span></div></div>
   <button class="card row" style="text-align:left" data-a="go" data-v="records"><div class="col grow"><div class="row between"><b>나의 독서 기록 <span class="tag">MVP 이후</span></b><span class="acc small">자세히 ›</span></div>${weekBars(70)}</div></button>
   <div class="card" style="padding-block:4px"><div class="list">
    <button class="li" data-a="goalsheet"><div class="col grow" style="gap:0"><b>하루 읽기 목표 <span class="tag">MVP 이후</span></b><span class="small">${S.goal?S.goal+'분 · 오늘 '+tm+'분':'꺼져 있어요'}</span></div><span class="sub">›</span></button>
    <button class="li" data-a="focusdef"><div class="col grow" style="gap:0"><b>집중 모드 기본값 <span class="tag">MVP 이후</span></b><span class="small">타이머를 켜면 다른 앱 잠그기 (웹 시연에서는 실제로 잠기지 않아요)</span></div><span class="switch ${S.focusDefault?'on':''}"></span></button>
    <button class="li" data-a="go" data-v="guardian"><div class="col grow" style="gap:0"><b>계정 · 보호자 <span class="tag">Should</span></b><span class="small">${u.guardian?'보호자 연결됨':'연결된 보호자 없음'}</span></div><span class="sub">›</span></button>
    <div class="li"><div class="col grow" style="gap:0"><b>알림</b><span class="small">리마인드 · 읽기 패턴 알림 · 하루 최대 2개 (웹 시연에서는 보내지 않아요)</span></div></div>
   </div></div>
   <div class="card plain"><b class="h3">시연 도구</b><span class="small">오늘: ${fmtDate(dk())}${S.dayOffset?' (+'+S.dayOffset+'일)':''}</span>
    <div class="btns"><button class="btn sec" data-a="nextday">하루 지나기</button><button class="btn sec" data-a="speed">타이머 ${S.speed?'빠르게 켜짐':'빠르게'}</button></div>

function fx(kind){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let c=$('#fx');if(c)c.remove();c=document.createElement('canvas');c.id='fx';document.body.appendChild(c);const W=c.width=innerWidth,H=c.height=innerHeight;const x=c.getContext('2d');const cols=['#f2c94c','#ff7a59','#7b9bff','#5fd09a','#ffffff'];const P=Array.from({length:kind==='burst'?90:140},()=>({x:W/2,y:H*0.4,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,r:3+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-t/110);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();});t++;if(t<120)requestAnimationFrame(f);else c.remove();})();}

 if(st.chapter>=b.chapters.length&&st.status!=='done'){st.status='done';st.doneDate=dk();}
 save();notifyBadges();
 const qs=b.quiz[st.chapter];if(qs&&qs.length&&!st.quiz[st.chapter]){ui.qpick=null;ui.qshown=false;ui.qres={c:0,t:qs.length};replace('quiz',{id,ch:st.chapter,i:0,from:prev});}
 else replace('ckdone',{id,from:prev});}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v,w=el.dataset.w;
 switch(a){
  case 'back':back();break;
  case 'tab':ui.flipped=false;tab(v);break;
  case 'go':if(v==='review'){ui.rv=null;ui.rsc=null;}go(v,w?{id:w}:{});break;
  case 'ob':{const n=+v;if(n===2){const nm=($('#nm')||{}).value;S.user.name=(nm||'').trim()||'책읽는고래';}if(n===3){S.user.guardianPhone=(($('#gp')||{}).value||'').trim();S.onboarded=true;save();tab('home');toast('반가워요, '+S.user.name+'님');break;}route={n:'onboard',step:n};render();break;}
  case 'grade':{const nm=$('#nm');if(nm)S.user.name=nm.value;S.user.grade=v;render();break;}
  case 'guardian':S.user.guardianPhone=(($('#gp')||{}).value||'');S.user.guardian=!S.user.guardian;render();break;
  case 'bf':ui.bookFilter=v;render();break;
  case 'book':go('book',{id:v});break;
  case 'gd':ui.goalDays=+v;render();break;
  case 'startbook':startBook(v);replace('book',{id:v});if(B(v).before)go('before',{id:v});toast('「'+B(v).title+'」 읽기를 시작했어요');break;
  case 'before':go('before',{id:v});break;
  case 'checkin':ui.ckCh=null;go('checkin',{id:v});break;
  case 'ckch':ui.ckCh=+v;render();break;
  case 'cksave':{const b=B(v);const st=bs(v);const ch=Math.min(b.chapters.length,Math.max(ui.ckCh||0,st.chapter+1));const pg=parseInt(($('#ckp')||{}).value,10);const note=($('#ckn')||{}).value;ui.ckCh=null;doCheckin(v,ch,pg>0?pg:null,note);break;}
  case 'qpick':if(!ui.qshown){ui.qpick=+v;render();}break;
  case 'qshow':{const b=B(route.id);const q=b.quiz[route.ch][route.i||0];ui.qshown=true;if(ui.qpick===q.a)ui.qres.c++;render();break;}
  case 'qnext':{const b=B(route.id);const qs=b.quiz[route.ch];const i=(route.i||0)+1;if(i<qs.length){ui.qpick=null;ui.qshown=false;route.i=i;render();}else{bs(b.id).quiz[route.ch]={c:ui.qres.c,t:ui.qres.t};save();replace('ckdone',{id:b.id,from:route.from});}break;}
  case 'content':{ui.gpick=null;ui.gshown=false;const st=bs(v);if(!st.contents.includes(w)){st.contents.push(w);save();}go('content',{id:v,key:w});notifyBadges();break;}
  case 'gpick':ui.gpick=+v;render();break;
  case 'gcheck':{const b=B(route.id);const x=allContents(b).find(c=>c.key===route.key);const st=bs(b.id);const ok=ui.gpick===x.a;ui.gshown=true;if(ok&&st.games[x.key]==null){st.games[x.key]=true;st.mission[x.mission]=(st.mission[x.mission]||0)+1;save();const m=b.missions.find(m=>m.id===x.mission);toast(m.name+' '+Math.min(st.mission[x.mission],m.goal)+' / '+m.goal);}render();break;}
  case 'csave':{const t=(($('#cin')||{}).value||'').trim();if(t.length<5){toast('조금만 더 적어 볼까요? (5자 이상)');break;}const st=bs(v);const x=allContents(B(v)).find(c=>c.key===w);st.inputs[w]=t;st.mission[x.mission]=true;save();toast('저장했어요 · 미션 완료');render();break;}
  case 'rsc':ui.rv=($('#rvl')||{}).value;ui.rsc=ui.rsc===+v?null:+v;render();break;
  case 'rsave':{const b=B(v);const st=bs(v);const line=(($('#rvl')||{}).value||'').trim();if(!validLine(line))break;const first=!st.confirmed;st.review={line,scene:ui.rsc!=null?ui.rsc:null};st.confirmed=true;if(first)S.reviews++;b.missions.forEach(m=>{if(m.type==='review')st.mission[m.id]=true;});let isNew=false;if(b.card&&!st.cardGot){st.cardGot=true;st.cardDate=dk();isNew=true;if(!S.title)S.title=b.card.title;}save();const g=checkBadges();save();ui.flipped=false;replace('reward',{id:v,badges:g});if(b.card&&!b.card.quiet)setTimeout(()=>fx('confetti'),700);break;}
  case 'st':ui.shelfTab=v;render();break;
  case 'ssel':ui.shelfSel=v;render();break;
  case 'title':S.title=v;save();render();break;
  case 'goalsheet':ui.goalPick=null;sheet={n:'goal'};render();break;
  case 'gpick2':ui.goalPick=+v;render();break;
  case 'goalok':S.goal=ui.goalPick||S.goal||10;S.goalSet=true;save();sheet=null;render();toast('하루 '+S.goal+'분으로 정했어요');break;
  case 'goaloff':S.goal=null;S.goalSet=true;save();sheet=null;render();toast('하루 목표를 껐어요');break;
  case 'focusdef':S.focusDefault=!S.focusDefault;save();render();break;
  case 'timerstart':{if(S.timer){go('timer');break;}S.timer={book:v||S.lastBook||null,start:Date.now(),paused:0,pausedAt:null,focus:S.focusDefault};if(v)S.lastBook=v;save();wakeOn();go('timer');if(!S.goalSet){ui.goalPick=null;sheet={n:'goal'};render();}break;}
  case 'tpause':{const t=S.timer;if(t.pausedAt){t.paused+=Date.now()-t.pausedAt;t.pausedAt=null;}else t.pausedAt=Date.now();save();render();break;}
  case 'focus':if(S.timer.focus){sheet={n:'focusOff'};render();setTimeout(bindHold,0);}else{S.timer.focus=true;save();render();toast('집중 모드를 켰어요 (시연)');}break;
  case 'bookchip':sheet={n:'bookchip'};render();break;
  case 'tbook':S.timer.book=v||null;save();sheet=null;render();break;
  case 'tend':ui.endBook=undefined;ui.endPage=null;sheet={n:'tend'};render();break;
  case 'endbook':ui.endBook=v||null;ui.endPage=null;render();break;
  case 'pg':{const inp=$('#pgin');ui.endPage=Math.max(0,(parseInt(inp.value,10)||0)+(+v));render();break;}
  case 'tsave':{const t=S.timer;const bid=ui.endBook!==undefined?ui.endBook:t.book;const min=elapsedMin();const pg=parseInt(($('#pgin')||{}).value,10)||0;S.sessions.push({date:dk(),min,book:bid||null});if(bid){const st=bs(bid);if(pg>(st.lastPage||0))st.lastPage=pg;st.pages.push({date:dk(),page:pg});S.lastBook=bid;}S.timer=null;wakeOff();save();sheet=null;notifyBadges();
   if(v==='1'&&bid){const b=B(bid);ui.ckCh=chapterForPage(b,pg);stack=[{n:'home'}];route={n:'checkin',id:bid};render();}else{tab('home');toast(min+'분 읽었어요'+(S.goal&&minutesOn(dk())>=S.goal?' · 오늘 목표 달성':''));}break;}
  case 'pagesheet':ui.endPage=null;sheet={n:'page',id:v};render();break;
  case 'psave':{const b=B(sheet.id);const st=bs(b.id);const pg=parseInt(($('#pgin')||{}).value,10)||0;if(pg>(st.lastPage||0))st.lastPage=pg;st.pages.push({date:dk(),page:pg});save();const id=b.id;sheet=null;notifyBadges();if(v==='1'){ui.ckCh=chapterForPage(b,pg);go('checkin',{id});}else{render();toast(pg+'쪽까지 기록했어요');}break;}
  case 'goalchange':sheet={n:'goalchange',id:v};render();break;
  case 'gcset':{const st=bs(sheet.id);st.goalDate=addDays(st.goalDate,+v);st.goalChanges=(st.goalChanges||0)+1;save();sheet=null;render();toast('목표일을 '+fmtDate(st.goalDate)+'로 바꿨어요');break;}
  case 'closesheet':sheet=null;render();break;
  case 'sheetbg':if(e.target===el){sheet=null;render();}break;
  case 'nextday':S.dayOffset++;save();render();toast(fmtDate(dk())+'로 넘어갔어요');break;
  case 'speed':S.speed=!S.speed;save();render();break;
  case 'resetask':sheet={n:'reset'};render();break;
  case 'reset':S=fresh();save();stack=[];route={n:'onboard',step:0};sheet=null;ui={};render();break;
  case 'ginvite':S.user.guardian=true;save();render();toast('보호자와 연결했어요 (시연)');break;
  case 'binfo':sheet={n:'badgeinfo',id:v};render();break;
  case 'cardview':ui.flipped=false;sheet={n:'cardview',id:v};render();break;
  case 'flip':{ui.flipped=!ui.flipped;const fi=el.querySelector('.flip-in');if(fi)fi.classList.toggle('flipped',ui.flipped);const hint=document.querySelector('.modal-wrap .mtxt:nth-of-type(2) span');break;}
  case 'gl':ui.gl=v;render();break;
  case 'coverpick':{const inp=$('#coverfile');if(inp){inp.dataset.id=v;inp.click();}break;}
  case 'coverdel':delete S.covers[v];save();render();break;
  case 'share':S.user.shareQuote=!S.user.shareQuote;save();render();break;
 }});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;const r=$('#results'),br=$('#browse');if(r)r.innerHTML=searchResults();if(br)br.hidden=!!ui.q.trim();return;}if(e.target.id==='rvl'){ui.rv=e.target.value;const ok=validLine(ui.rv);const b=$('#rvbtn');if(b)b.disabled=!ok;const h=$('#rvh');if(h)h.textContent=ui.rv?(ok?'좋아요':'10자 이상, 같은 글자 반복 없이 써 주세요'):'';}if(e.target.id==='pgin'){ui.endPage=parseInt(e.target.value,10)||0;const hb=$('#pghint');const bid=sheet&&sheet.n==='page'?sheet.id:(ui.endBook!==undefined?ui.endBook:(S.timer&&S.timer.book));if(hb&&bid)hb.innerHTML=pgHint(B(bid),bs(bid),ui.endPage);}});
function bindHold(){const h=$('#hold'),f=$('#holdfill');if(!h)return;let t0=0,raf=0;const stop=()=>{cancelAnimationFrame(raf);if(f)f.style.width='0';};const step=()=>{const p=Math.min(1,(Date.now()-t0)/5000);if(f)f.style.width=p*100+'%';if(p>=1){S.timer.focus=false;save();sheet=null;render();toast('집중 모드를 껐어요');return;}raf=requestAnimationFrame(step);};
 const down=e=>{e.preventDefault();t0=Date.now();step();};h.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(x=>h.addEventListener(x,stop));h.addEventListener('contextmenu',e=>e.preventDefault());}
document.getElementById('coverfile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];const id=e.target.dataset.id;if(!f||!id)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const W=300,H=Math.round(300*im.height/im.width);const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);try{S.covers[id]=c.toDataURL('image/jpeg',.8);save();toast('표지 사진을 넣었어요');}catch(err){toast('사진을 넣지 못했어요. 다른 사진으로 해 보세요');}render();};im.src=rd.result;};rd.readAsDataURL(f);e.target.value='';});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.timer&&!S.timer.pausedAt)wakeOn();});

if(S.onboarded){route={n:S.timer?'timer':'home'};}
render();
})();
</script>
