<title>책벗 시연 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a single phone-width column (max 480px) with a fixed bottom tab bar; sheets slide up over the column. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#e9ebf1; --line:#d9dce5;
  --fg:#1b1d24; --sub:#666a78; --faint:#9a9eab;
  --accent:#2b56d6; --accent-soft:#e3e9fb; --on-accent:#ffffff;
  --good:#1f7a4a; --good-soft:#e2f3e9; --warn:#a85a10; --warn-soft:#fbeedd;
  --dim:rgba(20,22,30,.45);
  --serif:"Gowun Batang","Apple SD Gothic Neo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13151b; --surface:#1c1f27; --sunk:#262a34; --line:#323745;
  --fg:#eceef3; --sub:#a4a9b8; --faint:#6f7484;
  --accent:#7b9bff; --accent-soft:#25304f; --on-accent:#0f1530;
  --good:#5fd09a; --good-soft:#18352a; --warn:#f0a660; --warn-soft:#3a2a17;
  --dim:rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#13151b; --surface:#1c1f27; --sunk:#262a34; --line:#323745;
  --fg:#eceef3; --sub:#a4a9b8; --faint:#6f7484;
  --accent:#7b9bff; --accent-soft:#25304f; --on-accent:#0f1530;
  --good:#5fd09a; --good-soft:#18352a; --warn:#f0a660; --warn-soft:#3a2a17;
  --dim:rgba(0,0,0,.6); color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;font-size:24px;line-height:1;padding:6px 8px 6px 0;color:var(--fg)}
.main{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:8px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main.notab{padding-bottom:32px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.soft{background:var(--accent-soft);border-color:transparent}
.plain{background:var(--sunk);border-color:transparent}
.row{display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.grow{flex:1;min-width:0}
.h2{font-size:17px;font-weight:700;margin:0}
.h3{font-size:15px;font-weight:700;margin:0}
.serif{font-family:var(--serif)}
.small{font-size:12.5px;color:var(--sub)}
.tiny{font-size:11.5px;color:var(--faint)}
.sub{color:var(--sub)}
.acc{color:var(--accent)}
.goodc{color:var(--good)}
.num{font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);width:100%}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--accent);padding:8px 0;font-weight:500;width:auto}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700;background:var(--warn-soft);color:var(--warn);vertical-align:middle;letter-spacing:.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.track{height:7px;border-radius:7px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:7px}
.cover{flex:none;border-radius:6px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-family:var(--serif);font-weight:700;line-height:1.25;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-size:16px}
textarea{min-height:84px;resize:vertical}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;text-align:left;width:100%;font-size:15px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{opacity:.55}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--dim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
.clock{width:236px;height:236px;border-radius:50%;border:10px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:12px auto 4px}
.clock b{font-size:46px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.switch{width:50px;height:30px;border-radius:30px;background:var(--line);border:0;position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:110px;gap:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:70%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}
.bars .b i.zero{background:var(--line)}
.bars .b i.today{outline:2px dashed var(--accent);outline-offset:2px}
.shelf{background:var(--sunk);border-radius:var(--r);padding:14px 14px 0;display:flex;flex-direction:column}
.shelf-row{display:flex;align-items:flex-end;gap:8px;min-height:132px;padding-bottom:0;flex-wrap:wrap}
.plank{height:8px;background:var(--line);border-radius:3px;margin:0 -6px 14px}
.slot{width:22px;height:110px;border-radius:3px;border:1px dashed var(--line)}
.bookcard{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:5px;aspect-ratio:3/4.3;max-width:100%;border:1.5px solid}
.bookcard .art{flex:1;border-radius:7px;display:flex;align-items:center;justify-content:center;min-height:0}
.bookcard.locked{border:1px dashed var(--line);background:var(--surface);align-items:center;justify-content:center;text-align:center;color:var(--faint)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:11.5px;color:var(--sub)}
.badge i{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:700;font-size:13px;border:1.5px solid var(--accent)}
.badge.off i{background:none;border:1.5px dashed var(--line);color:var(--faint)}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-weight:500;color:var(--sub);font-size:14px}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat>div{background:var(--sunk);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:0 10px 10px 0;padding:10px 12px;font-size:12.5px}
.hero{padding:40px 0 10px;display:flex;flex-direction:column;gap:12px}
.hero .logo{font-family:var(--serif);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px}
.stepper input{width:110px;text-align:center;font-size:26px;font-weight:700}
.hr{height:1px;background:var(--line)}
.cover{font-family:var(--serif)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;flex:none;color:var(--sub)}
.search input{border:0!important;padding:12px 0!important;background:none!important;outline:none}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.trace{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.trace.mine{border-color:var(--accent);background:var(--accent-soft)}
.trace.held{border-style:dashed;opacity:.85}
.tr-h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--sub)}.tr-h b{color:var(--fg);font-size:13px}
.tr-l{margin:0;font-size:15px;line-height:1.5}
.tr-b{font-size:14px;background:var(--sunk);border-radius:10px;padding:8px 10px;line-height:1.45}.tr-bt{display:block;font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:2px}
.tr-res{font-size:12.5px;color:var(--fg);background:var(--accent-soft);border-radius:8px;padding:6px 9px}.tr-res.lock{background:transparent;color:var(--faint);padding:0}
.tr-held{font-size:12.5px;color:var(--sub)}
.tr-f{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rx{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:4px 10px;font-size:12.5px;font-family:inherit}.rx.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}.rx:disabled{opacity:.6}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;padding:2px 0;cursor:pointer}.linkbtn.faint{color:var(--faint);margin-left:auto;font-size:12px}
.dist{display:flex;gap:4px;align-items:flex-end;height:64px;padding-top:6px}.dcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}.dcol i{display:block;width:100%;max-width:22px;background:var(--line);border-radius:4px 4px 2px 2px}.dcol span{font-size:10px;color:var(--faint)}.dcol.me i{background:var(--accent)}.dcol.me span{color:var(--accent);font-weight:700}
.mark{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.mark img{width:74px;border-radius:6px;flex:none;border:1px solid var(--line)}.mark-t{margin:0;font-size:15px;line-height:1.5}
.mwrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:none;background:#000}.mwrap canvas{display:block;width:100%;touch-action:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b1d24;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}

.tlrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scroll-snap-type:x mandatory;scrollbar-width:none}.tlrow::-webkit-scrollbar{display:none}
.tlc{position:relative;flex:none;width:126px;aspect-ratio:9/16;border:0;border-radius:14px;overflow:hidden;padding:0;scroll-snap-align:start;background:#222;text-align:left;color:#fff;font:inherit;cursor:pointer}
.tlc-art,.tlc-art svg{position:absolute;inset:0;width:100%;height:100%}
.tlc-sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.78))}
.tlc-tag{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.tlc-t{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:3px}.tlc-t b{font-size:13px;line-height:1.35}
.tl{position:fixed;inset:0;z-index:40;background:#111;color:#fff;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.tl-art{position:absolute;inset:-6%;animation:kb 16s ease-in-out infinite alternate}.tl-art svg{width:100%;height:100%}
@keyframes kb{from{transform:scale(1) translateY(0)}to{transform:scale(1.12) translateY(-2%)}}
.tl.quiet .tl-art{animation:none;filter:grayscale(.6) brightness(.7)}
.tl-sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.15) 30%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.85))}
.tl-top{position:relative;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;display:flex;flex-direction:column;gap:10px}
.tl-bar{display:flex;gap:4px}.tl-bar span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}.tl-bar i{display:block;height:100%;width:0;background:#fff}
.tl-x{border:0;background:none;color:#fff;font:inherit;font-size:15px;padding:4px 0;cursor:pointer}
.tl-caps{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:0 34px}
.tl-cap{position:absolute;left:34px;right:34px;margin:0;text-align:center;font-size:24px;font-weight:700;line-height:1.45;text-shadow:0 2px 12px rgba(0,0,0,.6);opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}.tl-cap.on{opacity:1;transform:none}
.tl.quiet .tl-cap{font-weight:500;font-size:21px}

function addDays(key,n){const [y,m,d]=key.split('-').map(Number);const t=new Date(y,m-1,d+n);return dk(t);}
function diffDays(a,b){const p=k=>{const [y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d);};return Math.round((p(b)-p(a))/864e5);}

function bs(id){if(!S.books[id])S.books[id]={status:'none',checkins:[],pages:[],contents:[],mission:{},inputs:{},games:{},quiz:{},chapter:0,lastPage:0,goalChanges:0};return S.books[id];}

function allContents(b){const o=[];Object.keys(b.contents).forEach(c=>b.contents[c].forEach(x=>o.push(Object.assign({ch:+c},x))));return o;}
function openContents(b){const st=bs(b.id);return allContents(b).filter(x=>x.ch<=st.chapter);}
function activityDays(){const s=new Set();Object.values(S.books).forEach(st=>{(st.checkins||[]).forEach(c=>s.add(c.date));(st.pages||[]).forEach(p=>s.add(p.date));});S.sessions.forEach(x=>s.add(x.date));return s;}
function streak(){const s=activityDays();let k=dk();if(!s.has(k))k=addDays(k,-1);let n=0;while(s.has(k)){n++;k=addDays(k,-1);}return n;}
function minutesOn(key){return S.sessions.filter(x=>x.date===key).reduce((a,x)=>a+x.min,0);}
function missionDone(b,m){const st=bs(b.id);if(m.type==='count')return (st.mission[m.id]||0)>=m.goal;if(m.type==='chapter'||m.type==='input'||m.type==='review')return !!st.mission[m.id];if(m.type==='allContents'){const all=allContents(b);return all.length>0&&all.every(x=>st.contents.includes(x.key));}return false;}
function missionCount(b){return b.missions.filter(m=>missionDone(b,m)).length;}
function chapterForPage(b,p){for(let i=0;i<b.pageEnds.length;i++){if(p<=b.pageEnds[i])return p===b.pageEnds[i]?i+1:i;}return b.chapters.length;}

function checkBadges(){const got=[];const give=id=>{if(!S.badges[id]){S.badges[id]=dk();got.push(BADGES.find(x=>x.id===id));}};
 const done=BOOKS.filter(b=>bs(b.id).confirmed);
 const lit=done.filter(b=>b.genre==='문학').length,non=done.filter(b=>b.genre==='비문학').length;
 if(lit>=2)give('story2');if(non>=2)give('know2');if(lit>=1&&non>=1)give('both');
 done.forEach(b=>{if(BADGES.find(x=>x.id==='topic_'+b.topic))give('topic_'+b.topic);});
 const st=streak();if(st>=3)give('streak3');if(st>=7)give('streak7');
 BOOKS.forEach(b=>{const all=allContents(b);if(all.length&&all.every(x=>bs(b.id).contents.includes(x.key)))give('explorer');});
 if(S.reviews>=3)give('review3');
 return got.filter(Boolean);}

    ${isFocus(b)?`<div class="card soft"><b class="acc">함께 읽기 책</b><span class="small">PoC 기간에 ${esc(lvlOf(S.user.grade))} 친구들이 같이 읽는 책이에요. 체크인할 때마다 친구들의 흔적과 떡밥이 열려요.</span></div>`:''}${cohortCard(b,0)}

    <div class="card"><b class="h3">언제까지 다 읽어 볼까요?</b><div class="chips">${[7,10,14,21,30].map(d=>`<button class="chip ${gd===d?'on':''}" data-a="gd" data-v="${d}">${d}일</button>`).join('')}</div><span class="small">완독 목표일 ${fmtDate(addDays(dk(),gd))}. 하루 분량은 정하지 않아요.</span></div>
    <button class="btn" data-a="startbook" data-v="${b.id}">이 책 읽기 시작</button>`,{back:true,tabs:false});}
  const tot=b.chapters.length;const dd=diffDays(dk(),st.goalDate);const oc=openContents(b);const next=allContents(b).filter(x=>x.ch>st.chapter).sort((a,c)=>a.ch-c.ch)[0];

  if(b.missions.length)h+=`<div class="card soft"><div class="row between"><b class="acc small">이 책의 미션</b><b class="acc small">${missionCount(b)} / ${b.missions.length} 완료</b></div>${b.missions.map(m=>{const d=missionDone(b,m);const p=m.type==='count'?` ${Math.min(st.mission[m.id]||0,m.goal)} / ${m.goal}`:'';return `<div class="row between"><div class="col" style="gap:0"><b>${esc(m.name)}</b><span class="small">${esc(m.desc)}</span></div><span class="small ${d?'goodc':''}" style="white-space:nowrap">${d?'완료':p||'진행 중'}</span></div>`;}).join('')}</div>`;
  if(b.before)h+=`<button class="card row" style="text-align:left" data-a="before" data-v="${b.id}"><b class="grow">읽기 전에 · 배경과 낱말</b><span class="sub">›</span></button>`;

   h+=oc.length?`<div class="cards" style="grid-template-columns:repeat(2,1fr)">${oc.map(x=>`<button class="card plain" style="text-align:left;gap:4px" data-a="content" data-v="${b.id}" data-w="${x.key}"><span class="tiny">${esc(b.chapters[x.ch-1])}${st.contents.includes(x.key)?' · 봤어요':''}</span><b>${esc(x.title)}</b><span class="small">${esc(x.sub)}</span></button>`).join('')}</div>`:`<p class="small" style="margin:0">첫 장을 체크인하면 콘텐츠가 열려요.</p>`;
   if(next)h+=`<div class="card row" style="border-style:dashed"><span class="small grow">${esc(b.chapters[next.ch-1])}까지 체크인하면 「${esc(next.title)}」이 열려요</span></div>`;}
  else h+=`<div class="note">콘텐츠가 없는 책이에요. 체크인과 기록만 남아요.</div>`;
  {const tv=visibleTraces(b,st.chapter).vis.filter(t=>!t.mine).length;const mn=S.traces.filter(t=>t.book===b.id).length;h+=cohortCard(b,st.chapter,true)+`<button class="card row" style="text-align:left" data-a="go" data-v="traces" data-w="${b.id}"><div class="col grow" style="gap:0"><b>흔적 · 떡밥</b><span class="small">읽은 곳까지 친구 흔적 ${tv}개 · 내 흔적 ${mn}개</span></div><span class="sub">›</span></button>`;
   const ms=marksOf(b.id);h+=`<div class="row between"><b class="h3">책갈피 ${ms.length}</b><span class="tiny">나만 봐요</span></div>`+(ms.length?ms.slice(-3).map(m=>markCard(m)).join('')+(ms.length>3?`<button class="linkbtn" data-a="go" data-v="marks">책갈피 전체 보기 ›</button>`:''):'')+markBtn(b.id);}

 checkin(){const b=B(route.id);const st=bs(b.id);const tot=b.chapters.length;const sel=Math.min(tot,Math.max(ui.ckCh||0,st.chapter+1));
  return shell('체크인',`<div class="col"><b class="h2">${esc(b.title)}, 어디까지 읽었나요?</b><span class="small">지금까지 ${st.chapter}장. 끝까지 읽은 장을 골라 주세요.</span></div>

 ckdone(){const b=B(route.id);const st=bs(b.id);const opened=allContents(b).filter(x=>x.ch>route.from&&x.ch<=st.chapter);const last=st.chapter===b.chapters.length;

 finish(){const b=B(route.id);const st=bs(b.id);const days=Math.max(1,diffDays(st.started,st.doneDate)+1);const min=S.sessions.filter(s=>s.book===b.id).reduce((a,s)=>a+s.min,0);

 review(){const b=B(route.id);const st=bs(b.id);const v=ui.rv!=null?ui.rv:'';const sc=ui.rsc;const ok=validLine(v);
  return shell('완독 기록',`<div class="col"><label class="h3" for="rvl">한 줄 감상 또는 가장 기억에 남는 문장 <span class="small">(필수 · 10자 이상)</span></label><span class="small" style="margin-top:-4px">둘 중 하나만 남기면 돼요. 카드 뒷면과 서재에 보여요.</span><textarea id="rvl" maxlength="120" placeholder="책을 덮고 떠오른 생각이나, 오래 남은 문장 하나">${esc(v)}</textarea><span class="small" id="rvh">${v?(ok?'좋아요':'10자 이상, 같은 글자 반복 없이 써 주세요'):'예: 규칙이 조금씩 바뀌는데 아무도 막지 못하는 게 무서웠다'}</span></div>
   ${b.scenes.length?`<div class="col"><span class="h3">기억에 남는 장면 <span class="small">(선택)</span> <span class="tag">결정 필요</span></span><span class="small">고르면 카드 뒷면에 「나의 장면」으로 새겨져요</span><div class="col">${b.scenes.map((s,i)=>`<button class="opt ${sc===i?'sel':''}" data-a="rsc" data-v="${i}">${esc(s)}</button>`).join('')}</div></div>`:''}
   ${marksOf(b.id).length?`<div class="col"><span class="h3">내 책갈피에서 고르기 <span class="small">(선택)</span> <span class="tag">MVP 이후</span></span><span class="small">${b.card?'고르면 카드 뒷면 「나의 장면」에 내 책갈피 글귀가 새겨져요 (나만 봐요)':'고르면 완독 기록에 함께 남아요'}</span><div class="col">${marksOf(b.id).map(m=>`<button class="opt ${ui.rmk===m.id?'sel':''}" data-a="rmk" data-v="${m.id}" style="text-align:left"><span class="tiny">${m.page?m.page+'쪽':''}</span> ${esc(m.text.length>60?m.text.slice(0,60)+'…':m.text)}</button>`).join('')}</div></div>`:''}
   <button class="btn" id="rvbtn" data-a="rsave" data-v="${b.id}" ${ok?'':'disabled'}>${b.card?'남기고 카드 받기':'남기기'}</button>`,{back:true,tabs:false});},

 reward(){const b=B(route.id);const g=route.badges||[];const q=b.card&&b.card.quiet;
  if(!b.card)return shell('완독 확인',`<div class="card soft rise"><b class="h2">완독이 확인됐어요</b><span class="small">이 책은 카드가 없어요. 서재 책장에 꽂혔어요.</span></div>${g.length?badgeRow(g):''}<button class="btn" data-a="tab" data-v="shelf">내 서재 보기</button>`,{back:false,tabs:false});
  return `<div class="modal-wrap" style="position:relative;min-height:100%;background:${q?'#1c1d22':'radial-gradient(circle at 50% 30%,'+b.ink+' 0%,#12131a 70%)'}">
   <div class="mtxt rise" style="animation-delay:.1s"><span>${q?'기억 카드':'새 카드'}</span><b class="serif" style="font-size:24px">${q?'끝까지 읽어 주어 고마워요':'「'+esc(b.card.name)+'」 카드를 받았어요'}</b></div>
   <div class="${q?'quietin':'reveal'}">${flipCard(b,!!ui.flipped)}</div>
   <div class="mtxt rise" style="animation-delay:1s"><span>카드를 누르면 뒷면에 나의 한 줄과 장면이 있어요</span><span>칭호 「${esc(b.card.title)}」${S.title===b.card.title?'를 쓰고 있어요':'를 받았어요'}</span></div>
   ${g.length?`<div class="row wrap" style="justify-content:center;gap:16px">${g.map((x,i)=>`<div class="col pop" style="align-items:center;animation-delay:${1.3+i*.25}s"><div class="medal small">${esc(x.short)}</div><span style="font-size:12px">${esc(x.name)}</span></div>`).join('')}</div>`:''}
   <button class="btn rise" style="animation-delay:1.5s" data-a="tab" data-v="shelf">서재에 꽂기</button><button class="btn sec rise" style="animation-delay:1.6s;background:transparent;color:#fff;border-color:rgba(255,255,255,.35)" data-a="tab" data-v="books">다음 책 고르기</button></div>`;},

 shelf(){const t=ui.shelfTab||'shelf';const done=BOOKS.filter(b=>bs(b.id).status==='done');
  let h=`<div class="seg"><button class="${t==='shelf'?'on':''}" data-a="st" data-v="shelf">책장</button><button class="${t==='cards'?'on':''}" data-a="st" data-v="cards">카드 · 뱃지</button></div>`;
  if(t==='shelf'){const rd=reading();const all=done.concat(rd);const sel=ui.shelfSel&&all.find(b=>b.id===ui.shelfSel)||all[0];
   h+=`<b class="h3">책장 · 다 읽은 책 ${done.length}권${rd.length?' · 읽는 중 '+rd.length+'권':''}</b><div class="shelf"><div class="shelf-row">${all.map(b=>{const r=bs(b.id).status==='reading';const s2=bs(b.id);return `<button style="border:0;padding:0;background:none;outline:${sel===b?'2px solid var(--accent)':'none'};border-radius:6px;position:relative;${r?'opacity:.78':''}" data-a="ssel" data-v="${b.id}" aria-label="${esc(b.title)}${r?' (읽는 중)':''}">${cover(b,74,108)}${r?`<span style="position:absolute;top:-3px;right:8px;width:11px;height:30px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)"></span><span style="position:absolute;left:0;bottom:0;height:5px;border-radius:0 0 0 6px;background:var(--accent);width:${s2.chapter/b.chapters.length*100}%"></span>`:''}</button>`;}).join('')}${Array.from({length:Math.max(0,5-all.length)}).map(()=>'<span class="slot"></span>').join('')}</div><div class="plank"></div></div>${rd.length?'<span class="tiny">책갈피 띠가 꽂힌 책은 아직 읽는 중이에요</span>':''}`;
   if(sel&&bs(sel.id).status==='reading'){const st=bs(sel.id);const dd=diffDays(dk(),st.goalDate);h+=`<div class="card"><span class="small">${esc(sel.title)} · 읽는 중 · ${st.chapter} / ${sel.chapters.length}장 · ${dd>=0?'목표일까지 '+dd+'일':'목표일 '+(-dd)+'일 지남'}</span><button class="btn sec" data-a="book" data-v="${sel.id}">이어 읽기</button></div>`;}
   else if(sel){const st=bs(sel.id);h+=`<div class="card"><span class="small">${esc(sel.title)} · ${fmtDate(st.doneDate)} 다 읽음${sel.missions.length?' · 미션 '+missionCount(sel)+'/'+sel.missions.length:''}</span>${st.review?`<b class="serif" style="font-size:16px">"${esc(st.review.line)}"</b>`:'<span class="small">아직 완독 기록이 없어요</span>'}${st.review&&st.review.scene!=null?`<span class="small">기억에 남는 장면 · ${esc(sel.scenes[st.review.scene])}</span>`:''}${!st.confirmed?`<button class="btn sec" data-a="go" data-v="review" data-w="${sel.id}">완독 기록 남기기</button>`:sel.card?`<button class="btn ghost" data-a="st" data-v="cards">받은 카드 「${esc(sel.card.name)}」 보기 ›</button>`:''}</div>`;}
   else h+=`<p class="small">아직 책장이 비어 있어요. 책을 읽기 시작하면 여기에 꽂혀요.</p>`;}
  else{const withCard=BOOKS.filter(b=>b.card);const got=withCard.filter(b=>bs(b.id).cardGot);
   h+=`<div class="row between"><b class="h3">책 카드 ${got.length} / ${withCard.length}</b><span class="small">다 읽은 책마다 한 장</span></div><div class="cards">${withCard.map(b=>bookCard(b,false)).join('')}</div>`;
   h+=S.title?`<div class="card soft"><span class="small acc">지금 쓰는 칭호</span><b class="h2 serif acc">${esc(S.title)}</b>${got.length>1?`<div class="chips">${got.map(b=>`<button class="chip ${S.title===b.card.title?'on':''}" data-a="title" data-v="${esc(b.card.title)}">${esc(b.card.title)}</button>`).join('')}</div>`:''}</div>`:'';
   h+=`<div class="row between"><b class="h3">뱃지 ${Object.keys(S.badges).length}개</b></div><div class="badges">${BADGES.map(x=>`<button class="badge ${S.badges[x.id]?'':'off'}" style="border:0;background:none;padding:0" data-a="binfo" data-v="${x.id}"><i>${esc(x.short)}</i>${esc(x.name)}</button>`).join('')}</div><p class="tiny">뱃지는 무작위 뽑기 · 교환이 없어요. 뱃지를 누르면 받는 조건이 보여요.</p>`;}
  return shell('내 서재',h);},

 my(){const u=S.user;const tm=minutesOn(dk());
  return shell('마이',`<div class="row"><div style="width:52px;height:52px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-weight:700" class="acc">${esc((u.name||'?').slice(0,1))}</div><div class="col grow" style="gap:0"><b class="h2">${esc(u.name)}</b><span class="small">${esc(u.grade)} · ${esc(lvlOf(u.grade))}${S.title?' · 칭호 '+esc(S.title):''}</span><span class="tiny">친구들에게 보이는 이름 · ${esc(u.nick)} (바꿀 수 없어요)</span></div></div>
   <button class="card row" style="text-align:left" data-a="go" data-v="marks"><div class="col grow" style="gap:0"><b>내 책갈피</b><span class="small">${S.marks.length}개 · 나만 봐요</span></div><span class="sub">›</span></button>
   <button class="card row" style="text-align:left" data-a="go" data-v="records"><div class="col grow"><div class="row between"><b>나의 독서 기록 <span class="tag">MVP 이후</span></b><span class="acc small">자세히 ›</span></div>${weekBars(70)}</div></button>
   <div class="card" style="padding-block:4px"><div class="list">
    <button class="li" data-a="goalsheet"><div class="col grow" style="gap:0"><b>하루 읽기 목표 <span class="tag">MVP 이후</span></b><span class="small">${S.goal?S.goal+'분 · 오늘 '+tm+'분':'꺼져 있어요'}</span></div><span class="sub">›</span></button>
    <button class="li" data-a="focusdef"><div class="col grow" style="gap:0"><b>집중 모드 기본값 <span class="tag">MVP 이후</span></b><span class="small">타이머를 켜면 다른 앱 잠그기 (웹 시연에서는 실제로 잠기지 않아요)</span></div><span class="switch ${S.focusDefault?'on':''}"></span></button>
    <div class="li"><div class="col grow" style="gap:0"><b>계정</b><span class="small">${esc(u.loginVia||'-')}로 가입 · ${u.u14?'만 14세 미만':'만 14세 이상'}${u.school?' · 학교 이름 입력함 (비공개)':''}${u.u14?' · 보호자 '+esc(u.guardianName||'')+' 님 (동의 완료)':''}</span></div></div>
    <button class="li" data-a="go" data-v="guardian"><div class="col grow" style="gap:0"><b>보호자 리포트 · 연결 <span class="tag">MVP 이후</span></b><span class="small">${u.guardian?'보호자 연결됨':'연결된 보호자 없음'}</span></div><span class="sub">›</span></button>
    <div class="li"><div class="col grow" style="gap:0"><b>알림</b><span class="small">리마인드 · 읽기 패턴 알림 · 하루 최대 2개 (웹 시연에서는 보내지 않아요)</span></div></div>
   </div></div>
   <div class="card plain"><b class="h3">시연 도구</b><span class="small">오늘: ${fmtDate(dk())}${S.dayOffset?' (+'+S.dayOffset+'일)':''}</span>
    <div class="btns"><button class="btn sec" data-a="nextday">하루 지나기</button><button class="btn sec" data-a="speed">타이머 ${S.speed?'빠르게 켜짐':'빠르게'}</button></div>
    <span class="tiny">「빠르게」는 타이머 1초를 1분으로 셉니다. 연속 독서와 목표일을 시험할 때 하루 지나기를 쓰세요.</span>
    <button class="btn sec" data-a="resetask">처음부터 다시 하기</button></div>`);},

 records(){const per={};S.sessions.forEach(s=>{if(s.book)per[s.book]=(per[s.book]||0)+s.min;});const gt={};S.sessions.forEach(s=>{if(s.book){const b=B(s.book);const k=b.genre+' · '+b.topic;gt[k]=(gt[k]||0)+s.min;}});const tot=S.sessions.reduce((a,s)=>a+s.min,0);const mx=Math.max(1,...Object.values(per));
  const fmt=m=>m>=60?Math.floor(m/60)+'시간 '+m%60+'분':m+'분';
  return shell('나의 독서 기록',`<div class="card">${weekBars(110)}</div>
   <div class="card"><div class="row between"><b class="h3">책별 읽은 시간</b><span class="small">총 ${fmt(tot)}</span></div>${Object.keys(per).length?Object.entries(per).map(([id,m])=>`<div class="col" style="gap:4px"><div class="row between"><span>${esc(B(id).title)}</span><b class="num">${fmt(m)}</b></div><div class="track"><i style="width:${m/mx*100}%"></i></div></div>`).join(''):'<span class="small">아직 타이머 기록이 없어요. 홈에서 「이어서 읽기」를 눌러 보세요.</span>'}${S.sessions.some(s=>!s.book)?`<span class="small">책 없이 읽은 시간 ${fmt(S.sessions.filter(s=>!s.book).reduce((a,s)=>a+s.min,0))} (총 시간에만 포함)</span>`:''}</div>
   <div class="card"><b class="h3">갈래 · 주제</b>${Object.keys(gt).length?Object.entries(gt).map(([k,m])=>`<div class="row between"><span>${esc(k)}</span><b class="num">${fmt(m)}</b></div>`).join(''):'<span class="small">기록이 쌓이면 보여요</span>'}</div>
   <div class="card soft"><b class="acc">${now().getFullYear()} 나의 독서 결산</b><span class="small acc">12월에 열려요. 올해 읽은 시간, 책, 갈래 · 주제를 돌아봐요.</span></div>`,{back:true,tabs:false});},

 guardian(){const u=S.user;
  return shell('계정 · 보호자',`<div class="note">보호자 리포트는 Should(MVP 이후) 기능이에요. PoC에서는 운영자가 직접 보내요.</div>
   <div class="card ${u.guardian?'':'plain'}" style="${u.guardian?'background:var(--good-soft);border-color:transparent':''}"><span class="small ${u.guardian?'goodc':''}">${u.guardian?'연결된 보호자 1명':'연결된 보호자 없음'}</span><b>${u.guardian?(u.guardianPhone?esc(u.guardianPhone.replace(/(\d{3})-?\d{3,4}-?(\d{4})/,'$1-****-$2')):'보호자 (번호 미입력)'):'보호자를 초대해 보세요'}</b></div>
   ${u.guardian?'':`<button class="btn" data-a="ginvite">보호자 초대 (시연: 바로 연결)</button>`}
   <button class="card row" style="text-align:left" data-a="go" data-v="greport"><b class="grow">보호자가 받는 주간 리포트 미리보기</b><span class="sub">›</span></button>
   <div class="card"><b class="h3">보호자에게 보이는 내용</b>${[['체크인한 날 수',1],['읽는 책과 진행(장)',1],['완독 목표일까지 남은 날',1],['이번 주 열린 콘텐츠 이름',1],['이야기해 볼 거리',1],['퀴즈 점수 · 정답률',0],['떠들기 장면 · 메모',0]].map(([a,v])=>`<div class="row between"><span class="small">${a}</span><b class="small ${v?'goodc':''}">${v?'보여요':'안 보여요'}</b></div>`).join('')}
   <button class="row" style="border:0;background:none;padding:6px 0 0;text-align:left" data-a="share"><div class="col grow" style="gap:0"><b>한 줄 감상도 보여 주기</b><span class="small">기본은 꺼져 있어요</span></div><span class="switch ${u.shareQuote?'on':''}"></span></button></div>`,{back:true,tabs:false});},

 greport(){const today=dk();const start=addDays(today,-6);const days=[...activityDays()].filter(d=>d>=start&&d<=today);const r=BOOKS.filter(b=>['reading','done'].includes(bs(b.id).status));
  const rows=r.map(b=>{const st=bs(b.id);const before=(st.checkins||[]).filter(c=>c.date<start).reduce((a,c)=>Math.max(a,c.chapter),0);return {b,st,from:before,to:st.chapter};});
  const opened=[];r.forEach(b=>{const st=bs(b.id);(st.checkins||[]).filter(c=>c.date>=start).forEach(c=>{allContents(b).filter(x=>x.ch>c.prev&&x.ch<=c.chapter).forEach(x=>opened.push(b.title+' · '+x.title));});});
  let talk='';for(const x of rows){const ks=Object.keys(x.b.talk).map(Number).filter(k=>k<=x.to).sort((a,c)=>c-a);if(ks.length){talk=x.b.talk[ks[0]];break;}}
  const quote=S.user.shareQuote&&rows.map(x=>x.st.review&&x.st.review.line).find(Boolean);
  return shell('주간 리포트 (보호자 화면)',`<span class="pill">${esc(S.user.name)} · ${esc(S.user.grade)}</span><div class="col" style="gap:0"><b class="h2">이번 주 리포트</b><span class="small">${fmtDate(start)} ~ ${fmtDate(today)} · 일요일 저녁에 도착해요</span></div>
   <div class="card"><span class="small">이번 주 한눈에</span><div class="row between"><span class="sub">기록한 날</span><b class="num">${days.length}일 / 7일</b></div>${rows.map(x=>`<div class="row between"><span class="sub">${esc(x.b.title)}</span><b class="num">${x.from===x.to?x.to+'장 (변화 없음)':x.from+'장 → '+x.to+'장'}</b></div>`).join('')||'<span class="small">아직 읽는 책이 없어요</span>'}${rows.filter(x=>x.st.status==='reading').map(x=>{const d=diffDays(today,x.st.goalDate);return `<div class="row between"><span class="sub">완독 목표일까지</span><b class="num">${d>=0?d+'일 남음':(-d)+'일 지남'}</b></div>`;}).join('')}</div>
   <div class="card"><span class="small">이번 주 열린 콘텐츠</span>${opened.length?opened.slice(0,3).map(t=>`<b>${esc(t)}</b>`).join(''):'<span class="small">이번 주에는 새로 열린 콘텐츠가 없어요</span>'}</div>
   <div class="card soft"><b class="acc small">이야기해 볼 거리</b><span>${esc(talk||'이번 주에 읽은 부분 중 가장 기억에 남는 장면을 물어봐 주세요.')}</span></div>
   ${quote?`<div class="card plain"><span class="tiny">아이가 남긴 한 줄 (공개를 허락한 경우)</span><b class="serif">"${esc(quote)}"</b></div>`:''}
   <span class="tiny">점수, 정답률, 다른 아이와의 비교는 보여 드리지 않아요.</span>`,{back:true,tabs:false});},

 trace(){const b=B(route.id);const st=bs(b.id);const ed=route.edit?S.traces.find(t=>t.id===route.edit):null;const ty=ui.trType!=null?ui.trType:(ed?ed.bt:'');const v=ui.trLine!=null?ui.trLine:(ed?ed.line:'');const bv=ui.trBait!=null?ui.trBait:(ed?ed.bait:'');const ok=validLine(v);
  return shell('내 흔적 남기기',`<div class="card soft"><span class="pill">${esc(chName(b,ed?ed.ch:st.chapter))}에서</span><span class="small">흔적은 지금 읽은 위치에 고정돼요. 나보다 덜 읽은 친구에게는 보이지 않아요.</span></div>

function fx(kind){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let c=$('#fx');if(c)c.remove();c=document.createElement('canvas');c.id='fx';document.body.appendChild(c);const W=c.width=innerWidth,H=c.height=innerHeight;const x=c.getContext('2d');const cols=['#f2c94c','#ff7a59','#7b9bff','#5fd09a','#ffffff'];const P=Array.from({length:kind==='burst'?90:140},()=>({x:W/2,y:H*0.4,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,r:3+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-t/110);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();});t++;if(t<120)requestAnimationFrame(f);else c.remove();})();}

function seedNick(t,i){return NICK_A[hashN(t+'a'+i)%NICK_A.length]+' '+NICK_B[hashN(t+'b'+i*7)%NICK_B.length]+' '+(10+hashN(t+'c'+i*13)%90);}
function allTraces(b){const seed=(SEED[b.title]||[]).map((r,i)=>({id:'sd-'+b.id+'-'+i,book:b.id,ch:r[0],lvl:r[1],line:r[2],bt:r[3],bait:r[4],resCh:r[5],res:r[6],n:{like:r[7],cur:r[8],hit:r[9]},nick:seedNick(b.title,i),seed:true}));
 const mine=S.traces.filter(t=>t.book===b.id).map(t=>Object.assign({},t,{mine:true,lvl:lvlOf(S.user.grade),nick:S.user.nick,n:{like:0,cur:0,hit:0}}));return seed.concat(mine);}
function rCount(t,k){return (t.n[k]||0)+(S.reacts[t.id+':'+k]?1:0);}
function visibleTraces(b,upTo){const me=lvlOf(S.user.grade);const all=allTraces(b);const vis=all.filter(t=>t.ch<=upTo&&(t.mine||(t.lvl===me&&!S.reported[t.id]))&&(!t.mine||t.status==='shown'||t.mine));const hiddenLvl=all.filter(t=>!t.mine&&t.ch<=upTo&&t.lvl!==me).length;return {vis,hiddenLvl,ahead:all.filter(t=>!t.mine&&t.lvl===me&&t.ch>upTo).length};}
function chName(b,ch){return b.chapters[ch-1]||ch+'장';}
function traceCard(b,t,myCh){const quiet=b.card&&b.card.quiet;const btl=t.bt==='p'?'예측':'궁금';
 let res='';if(t.bt&&t.resCh){res=myCh>=t.resCh?`<div class="tr-res"><b>떡밥 결과</b> · ${t.bt==='p'?(t.res==='yes'?'쓴 친구가 「맞았다」고 했어요':'쓴 친구가 「빗나갔다」고 했어요'):(t.res==='yes'?'쓴 친구가 「답을 찾았다」고 했어요':'쓴 친구는 아직 답을 못 찾았대요')}</div>`:`<div class="tr-res lock">떡밥 결과는 ${esc(chName(b,t.resCh))}을 지나면 열려요</div>`;}
 if(t.mine&&t.bt&&t.myRes)res=`<div class="tr-res"><b>내 떡밥 결과</b> · ${t.bt==='p'?(t.myRes==='yes'?'맞았다':t.myRes==='no'?'빗나갔다':'아직 모르겠다'):(t.myRes==='yes'?'답을 찾았다':t.myRes==='no'?'아직 못 찾았다':'아직 모르겠다')}</div>`;
 const R=(k,l)=>`<button class="rx ${S.reacts[t.id+':'+k]?'on':''}" data-a="react" data-v="${t.id}" data-w="${k}" ${t.mine?'disabled':''}>${l} ${rCount(t,k)}</button>`;
 const held=t.mine&&t.status==='held';
 return `<div class="trace ${t.mine?'mine':''} ${held?'held':''}"><div class="tr-h"><b>${esc(t.nick)}</b><span>${esc(t.lvl)} · ${esc(chName(b,t.ch))}에서</span>${t.mine?'<span class="pill">나</span>':''}</div>
  <p class="tr-l">${esc(t.line)}</p>${t.bt?`<div class="tr-b"><span class="tr-bt">떡밥 · ${btl}</span>${esc(t.bait)}</div>`:''}${res}
  ${held?`<div class="tr-held">자동 필터: ${esc(t.reason)} 친구들에게는 보이지 않아요. <button class="linkbtn" data-a="tredit" data-v="${t.id}">고쳐서 다시 올리기</button></div>`:`<div class="tr-f">${R('like','공감')}${t.bt?R('cur','나도 궁금'):''}${t.bt==='p'&&myCh>=(t.resCh||99)?R('hit','떡밥 맞았다'):''}${t.mine?'':`<button class="linkbtn faint" data-a="report" data-v="${t.id}">신고</button>`}</div>`}</div>`;}
function cohort(b){const h=hashN(b.title+'cohort');const focus=isFocus(b)||!b.listOnly;const n=focus?12+h%18:(h%4);const tot=b.chapters.length;const dist=Array.from({length:tot},(_,i)=>focus?((h>>>(i%20))%4)+(i<tot/2?1:0):0);let k=n-dist.reduce((a,x)=>a+x,0);for(let i=0;k>0;i=(i+1)%tot){dist[i]++;k--;}return {n,dist};}
function cohortCard(b,myCh,started){const c=cohort(b);const me=lvlOf(S.user.grade);if(!c.n)return `<div class="card plain"><b class="h3">책 동기</b><span class="small">아직 비슷한 시기에 이 책을 시작한 ${me} 친구가 없어요. 「함께 읽기 책」을 고르면 동기가 많아요.</span></div>`;
 const mx=Math.max(1,...c.dist);return `<div class="card plain"><div class="row between"><b class="h3">책 동기 · ${me} ${c.n}명</b><span class="tiny">최근 4주 안에 시작</span></div><div class="dist">${c.dist.map((x,i)=>`<div class="dcol ${i+1===myCh?'me':''}"><i style="height:${Math.max(4,x/mx*44)}px"></i><span>${i+1}</span></div>`).join('')}</div><span class="small">${myCh?`나는 ${esc(chName(b,myCh))}까지 · 나보다 앞선 친구 ${c.dist.slice(myCh).reduce((a,x)=>a+x,0)}명`:started?`방금 시작했어요 · 먼저 읽고 있는 친구 ${c.n}명`:'지금 시작하면 이 친구들과 함께 읽어요'}</span></div>`;}
const BAN=['시발','씨발','ㅅㅂ','ㅆㅂ','병신','ㅂㅅ','좆','존나','개새','닥쳐','꺼져','미친놈','미친년'];
function autoFilter(t){const x=String(t||'');const z=x.replace(/\s/g,'');
 if(/01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/.test(x)||/\d{3,4}[-.]\d{4}/.test(x))return '전화번호로 보이는 내용이 있어요.';
 if(/@[A-Za-z0-9_.]{3,}/.test(x)||/(인스타|카톡|카카오톡|오픈채팅|디엠|DM|페메|틱톡|디스코드)/i.test(x))return 'SNS나 연락처로 보이는 내용이 있어요.';
 if(/[가-힣]{1,8}(초등학교|중학교|고등학교)/.test(z)||/[가-힣]{2,6}(초|중|고)\d학년/.test(z))return '학교 이름으로 보이는 내용이 있어요.';
 if(BAN.some(w=>z.includes(w)))return '친구에게 상처가 될 수 있는 말이 있어요.';
 if(/(결말은|결말이|범인은|마지막에\s?(죽|사라))/.test(x))return '결말을 알려 주는 내용 같아요.';return '';}
function myOpenBaits(b,ch){return S.traces.filter(t=>t.book===b.id&&t.bt&&!t.myRes&&t.status==='shown'&&(ch>=t.ch+2||ch>=b.chapters.length));}
function traceSection(b,st,from){const myCh=st.chapter;const {vis,hiddenLvl,ahead}=visibleTraces(b,myCh);const near=vis.filter(t=>!t.mine&&t.ch>from&&t.ch<=myCh);const pick=(near.length?near:vis.filter(t=>!t.mine)).sort((a,c)=>c.ch-a.ch).slice(0,3);
 let h=`<div class="row between"><b class="h3">${near.length?'같은 곳을 지난 친구들':'앞에서 남긴 친구들의 흔적'}</b>${vis.length?`<button class="linkbtn" data-a="go" data-v="traces" data-w="${b.id}">전체 ${vis.filter(t=>!t.mine).length}개 ›</button>`:''}</div>`;
 h+=pick.length?pick.map(t=>traceCard(b,t,myCh)).join(''):`<div class="card plain"><b>아직 이 구간에 흔적이 없어요</b><span class="small">이 구간의 첫 흔적을 남겨 줘. 다음에 읽는 친구가 보게 돼요.</span></div>`;
 const notes=[];if(hiddenLvl)notes.push(`다른 학교급 친구의 흔적 ${hiddenLvl}개는 보이지 않아요`);if(ahead)notes.push(`앞으로 읽을 구간에 흔적 ${ahead}개가 기다려요`);if(notes.length)h+=`<span class="tiny">${notes.join(' · ')}</span>`;return h;}

  case 'flip':{ui.flipped=!ui.flipped;const fi=el.querySelector('.flip-in');if(fi)fi.classList.toggle('flipped',ui.flipped);const hint=document.querySelector('.modal-wrap .mtxt:nth-of-type(2) span');break;}
  case 'gl':ui.gl=v;ui.gn=30;render();break;
  case 'glv':ui.glv=+v;ui.gn=30;render();break;
  case 'gty':ui.gty=v;ui.gn=30;render();break;
  case 'gso':ui.gso=v;ui.gn=30;render();break;
  case 'gmore':ui.gn=(ui.gn||30)+30;render();break;
  case 'amore':ui.an=(ui.an||30)+30;render();break;
  case 'qmore':{ui.qn=(ui.qn||30)+30;const r=$('#results');if(r)r.innerHTML=searchResults();break;}
  case 'coverpick':{const inp=$('#coverfile');if(inp){inp.dataset.id=v;inp.click();}break;}
  case 'coverdel':delete S.covers[v];save();render();break;
  case 'share':S.user.shareQuote=!S.user.shareQuote;save();render();break;
 }});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;ui.qn=30;const r=$('#results'),br=$('#browse');if(r)r.innerHTML=searchResults();if(br)br.hidden=!!ui.q.trim();return;}if(e.target.id==='trl'){const ok=validLine(e.target.value);const b=$('#trbtn');if(b)b.disabled=!ok;const h=$('#trh');if(h)h.textContent=e.target.value?(ok?'좋아요':'10자 이상, 같은 글자 반복 없이 써 주세요'):'';}if(e.target.id==='rvl'){ui.rv=e.target.value;const ok=validLine(ui.rv);const b=$('#rvbtn');if(b)b.disabled=!ok;const h=$('#rvh');if(h)h.textContent=ui.rv?(ok?'좋아요':'10자 이상, 같은 글자 반복 없이 써 주세요'):'';}if(e.target.id==='pgin'){ui.endPage=parseInt(e.target.value,10)||0;const hb=$('#pghint');const bid=sheet&&sheet.n==='page'?sheet.id:(ui.endBook!==undefined?ui.endBook:(S.timer&&S.timer.book));if(hb&&bid)hb.innerHTML=pgHint(B(bid),bs(bid),ui.endPage);}});
function bindHold(){const h=$('#hold'),f=$('#holdfill');if(!h)return;let t0=0,raf=0;const stop=()=>{cancelAnimationFrame(raf);if(f)f.style.width='0';};const step=()=>{const p=Math.min(1,(Date.now()-t0)/5000);if(f)f.style.width=p*100+'%';if(p>=1){S.timer.focus=false;save();sheet=null;render();toast('집중 모드를 껐어요');return;}raf=requestAnimationFrame(step);};
 const down=e=>{e.preventDefault();t0=Date.now();step();};h.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(x=>h.addEventListener(x,stop));h.addEventListener('contextmenu',e=>e.preventDefault());}
document.getElementById('coverfile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];const id=e.target.dataset.id;if(!f||!id)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const W=300,H=Math.round(300*im.height/im.width);const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);try{S.covers[id]=c.toDataURL('image/jpeg',.8);save();toast('표지 사진을 넣었어요');}catch(err){toast('사진을 넣지 못했어요. 다른 사진으로 해 보세요');}render();};im.src=rd.result;};rd.readAsDataURL(f);e.target.value='';});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.timer&&!S.timer.pausedAt)wakeOn();});

if(S.onboarded){route={n:S.timer?'timer':'home'};}
render();
/* ===== 사진 책갈피 엔진 ===== */
function loadImg(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src;});}
function startMark(id,im){const MAX=1600;const k=Math.min(1,MAX/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 window._mimg=c;ui.mstrokes=[];ui.mstep='paint';ui.mthumb=null;ui.merr=null;ui.mtext='';sheet=null;if(route.n==='mark'){route.id=id;render();}else go('mark',{id});}
async function sampleImage(){try{await Promise.race([document.fonts.load('40px "Gowun Batang"'),new Promise(r=>setTimeout(r,1500))]);}catch(e){}const c=document.createElement('canvas');c.width=1000;c.height=1300;const g=c.getContext('2d');g.fillStyle='#f6f1e6';g.fillRect(0,0,1000,1300);g.fillStyle='#2a2620';g.font='34px "Gowun Batang", "Noto Serif CJK KR", serif';
 const L=['창문 너머로 첫눈이 내리기 시작했다.','나는 읽던 책을 덮지 못하고','같은 줄을 몇 번이나 다시 읽었다.','어떤 문장은 처음 읽을 때보다','두 번째에 더 오래 남는다.','그날 밤 그 문장은','내 공책 맨 앞장으로 옮겨졌다.','다음 날 아침, 눈은 그쳐 있었다.','하지만 문장은 그치지 않았다.'];
 L.forEach((t,i)=>g.fillText(t,90,170+i*104));g.font='24px serif';g.fillStyle='#8a8070';g.fillText('48',480,1240);g.fillText('예시 페이지 · 시연용으로 직접 쓴 문장',90,90);return loadImg(c.toDataURL('image/jpeg',.92));}
document.getElementById('markfile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{loadImg(rd.result).then(im=>startMark(ui.markBook,im)).catch(()=>{ui.toast='사진을 열지 못했어요';render();});};rd.readAsDataURL(f);});
function markScale(){const cv=$('#mcv');return cv?window._mimg.width/cv.width:1;}
function brush(){return Math.max(24,Math.round((window._mimg?window._mimg.width:1000)/22));}
function drawMark(){const cv=$('#mcv');if(!cv||!window._mimg)return;const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);g.drawImage(window._mimg,0,0,cv.width,cv.height);const s=markScale();
 g.save();g.globalAlpha=.42;g.strokeStyle='#ffd400';g.lineCap='round';g.lineJoin='round';g.lineWidth=brush()/s;(ui.mstrokes||[]).forEach(st=>{g.beginPath();st.forEach((p,i)=>{const x=p[0]/s,y=p[1]/s;i?g.lineTo(x,y):g.moveTo(x,y);});if(st.length===1)g.lineTo(st[0][0]/s+.1,st[0][1]/s);g.stroke();});g.restore();}
function setupMark(){const cv=$('#mcv');if(!cv||!window._mimg)return;const wrap=cv.parentElement;const W=wrap.clientWidth;cv.width=W;cv.height=Math.round(W*window._mimg.height/window._mimg.width);drawMark();let cur=null;
 const pt=e=>{const r=cv.getBoundingClientRect();const s=markScale();return [(e.clientX-r.left)*s,(e.clientY-r.top)*s];};
 cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur=[pt(e)];(ui.mstrokes=ui.mstrokes||[]).push(cur);drawMark();});
 cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();cur.push(pt(e));drawMark();});
 const end=()=>{cur=null;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);}
function cropPainted(){const im=window._mimg;const ss=ui.mstrokes||[];if(!ss.length)return null;const r=brush()/2;let x0=1e9,y0=1e9,x1=-1,y1=-1;ss.forEach(st=>st.forEach(p=>{x0=Math.min(x0,p[0]-r);y0=Math.min(y0,p[1]-r);x1=Math.max(x1,p[0]+r);y1=Math.max(y1,p[1]+r);}));
 x0=Math.max(0,Math.floor(x0));y0=Math.max(0,Math.floor(y0));x1=Math.min(im.width,Math.ceil(x1));y1=Math.min(im.height,Math.ceil(y1));const w=x1-x0,h=y1-y0;if(w<8||h<8)return null;
 const m=document.createElement('canvas');m.width=w;m.height=h;const g=m.getContext('2d');g.lineCap='round';g.lineJoin='round';g.lineWidth=r*2;g.strokeStyle='#000';ss.forEach(st=>{g.beginPath();st.forEach((p,i)=>{const x=p[0]-x0,y=p[1]-y0;i?g.lineTo(x,y):g.moveTo(x,y);});if(st.length===1)g.lineTo(st[0][0]-x0+.1,st[0][1]-y0);g.stroke();});
 g.globalCompositeOperation='source-in';g.drawImage(im,x0,y0,w,h,0,0,w,h);
 const k=h<120?2:1;const o=document.createElement('canvas');o.width=w*k;o.height=h*k;const og=o.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,o.width,o.height);og.drawImage(m,0,0,o.width,o.height);
 const t=document.createElement('canvas');const tw=Math.min(360,w);t.width=tw;t.height=Math.round(h*tw/w);t.getContext('2d').drawImage(im,x0,y0,w,h,0,0,t.width,t.height);return {ocr:o,thumb:t.toDataURL('image/jpeg',.6)};}
function loadTess(){if(window.Tesseract)return Promise.resolve(window.Tesseract);return new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=()=>window.Tesseract?ok(window.Tesseract):no(new Error('no Tesseract'));sc.onerror=()=>no(new Error('load failed'));document.head.appendChild(sc);});}
function cleanOcr(t){return String(t||'').replace(/\n+/g,' ').replace(/([가-힣])\s(?=[가-힣]\s[가-힣])/g,'$1 ').replace(/\s{2,}/g,' ').replace(/[|_~^]/g,'').trim();}
async function runOcr(){const c=cropPainted();if(!c){ui.toast='먼저 남기고 싶은 줄을 칠해 주세요';render();return;}
 ui.mthumb=c.thumb;ui.mstep='ocr';ui.mcancel=false;render();const prog=t=>{const el=$('#mprog');if(el)el.textContent=t;};
 const timeout=new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),90000));
 try{const T=await Promise.race([loadTess(),timeout]);prog('인식기를 불러오는 중이에요');
  if(!window._ocrW)window._ocrW=await Promise.race([T.createWorker('kor',1,{logger:m=>{if(m.status==='recognizing text')prog('글자를 읽는 중 '+Math.round(m.progress*100)+'%');else if(m.status)prog('준비 중 · '+m.status);}}),timeout]);
  const r=await Promise.race([window._ocrW.recognize(c.ocr),timeout]);if(ui.mcancel)return;const txt=cleanOcr(r.data&&r.data.text);
  ui.mtext=txt;ui.merr=txt?null:'글자를 읽지 못했어요. 직접 적어 주세요.';}
 catch(e){if(ui.mcancel)return;ui.mtext='';ui.merr='이 화면에서는 글자 인식기를 불러오지 못했어요. 직접 적어 주세요. (GitHub Pages 등으로 연 단독 HTML에서 다시 시도해 보세요)';}
 if(route.n==='mark'){ui.mstep='edit';render();}}
})();
