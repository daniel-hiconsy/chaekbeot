<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="책벗"><meta name="theme-color" content="#ffffff"><title>책벗</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
</head><body>
<style>
/* Layout: 왼쪽 시나리오 패널 + 가운데 375×812 폰. 와이어프레임 톤(파랑 #2B6BE5, 회색 면)을 그대로 쓰는 단일 라이트 테마 */
:root{
  --bg:#e9eaee; --phone:#ffffff; --fg:#1a1a1f; --mu:#6e6e78; --line:#d6d6db; --gray:#f2f2f5;
  --blue:#2b6be5; --bs:#e8f0ff; --ok:#e5f7eb; --or:#ffedd9; --dim:rgba(0,0,0,.45);
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.45}
.stage{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:280px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.panel h1{font-size:20px;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--mu);font-size:13px}
.panel .grp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel .grp b{font-size:12px;color:var(--mu)}
.panel button{font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.panel button.on{border-color:var(--blue);color:var(--blue);font-weight:700;background:var(--bs)}
.panel label{display:flex;gap:8px;align-items:center;font-size:13px}
.sid{font-size:12px;color:var(--blue);font-weight:700}
.phone{width:375px;max-width:100%;height:812px;background:var(--phone);border:1px solid var(--line);border-radius:28px;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(20,30,60,.12)}
.hdr{height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.hdr .back{background:none;border:0;font-size:20px;cursor:pointer;padding:0 4px;color:var(--fg)}
.hdr .t{font-weight:700;font-size:16px}
.tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tab{border:0;background:none;padding:6px 10px;border-radius:999px;font:inherit;font-size:13px;color:var(--mu);cursor:pointer;white-space:nowrap;font-weight:500}
.tab.on{background:var(--bs);color:var(--blue);font-weight:700}
.tab sup{color:var(--blue);font-weight:700;font-size:10px;margin-left:2px}
.scroll{flex:1;overflow-y:auto;padding:16px 20px 140px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--gray);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card.blue{background:var(--bs)}.card.ok{background:var(--ok)}.card.or{background:var(--or)}
.card.dash{background:#fff;border:1px dashed var(--line)}
.h{font-weight:700;font-size:15px}
.mu{color:var(--mu);font-size:12px}
.row{display:flex;align-items:center;gap:8px}.row .grow{flex:1;min-width:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer;text-align:left;font:inherit;width:100%}
.item .ic{width:40px;height:40px;border-radius:10px;background:var(--bs);flex:none}
.item .k{font-size:11px;color:var(--blue);font-weight:700}
.item .tt{font-weight:700}
.item.locked{filter:blur(2.5px);opacity:.6}
.lockwrap{display:flex;align-items:center;gap:8px;cursor:pointer}
.lockwrap .item{flex:1}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gray);color:var(--mu);white-space:nowrap}
.chip.b{background:var(--bs);color:var(--blue)}.chip.s{background:var(--blue);color:#fff}
.rail{border-left:2px solid var(--line);margin:4px 0 0 7px;padding-left:20px;display:flex;flex-direction:column;gap:20px}
.node{position:relative;display:flex;flex-direction:column;gap:6px}
.node .dt{position:absolute;left:-27px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.node.grey .dt{background:var(--mu)}.node.okn .dt{background:#2e965a}.node.okn .nk{color:#2e965a}
.node.now .dt{width:16px;height:16px;left:-30px;top:3px;box-shadow:0 0 0 4px var(--bs)}.node.now .nt{font-size:17px}
.node.next .dt{background:#fff;border:2px solid var(--line)}.node.next .nk,.node.next .nt{color:var(--mu)}
.nk{font-size:12px;font-weight:700;color:var(--blue)}.nt{font-weight:700;font-size:15px}
.sub{display:flex;align-items:center;gap:10px;background:var(--gray);border:0;border-radius:10px;padding:10px 12px;font:inherit;text-align:left;width:100%;cursor:pointer;color:var(--fg)}
.sub.todo{background:#fff;border:1px solid var(--bs)}
.card.blue .sub.todo{border-color:#fff}
.badge{font-size:10px;font-weight:700;color:var(--blue);background:#fff;border-radius:6px;padding:2px 6px;flex:none}.badge.ok{color:#2e965a;background:var(--ok)}
.log{display:flex;gap:10px;align-items:flex-start}.log .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex:none}
.bottom{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:12px 20px 22px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--gray)}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:12px;border:0;background:var(--blue);color:#fff;cursor:pointer;width:100%}
.btn.sec{background:#fff;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--mu);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:4px}
.btn:focus-visible,.item:focus-visible,.tab:focus-visible,.link:focus-visible,.panel button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.overlay{position:absolute;inset:0;background:var(--dim);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.overlay.center{justify-content:center;align-items:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:14px 20px 24px;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.dialog{background:#fff;border-radius:16px;padding:20px;width:311px;display:flex;flex-direction:column;gap:12px}
.inp{display:flex;align-items:center;gap:8px;border:2px solid var(--blue);border-radius:12px;padding:8px 14px}
.inp span{white-space:nowrap}
.inp input{border:0;font:inherit;font-size:28px;font-weight:700;width:100%;outline:none;min-width:0}
select,textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;background:#fff}
textarea{min-height:140px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:8px 14px;background:var(--gray);cursor:pointer}
.chips.kf button{padding:6px 12px;font-size:12px}
.chips button.on{background:var(--blue);color:#fff}
.timer{flex:1;display:flex;flex-direction:column;align-items:center;gap:24px;padding:28px 20px}
.ring{width:240px;height:240px;border-radius:50%;border:10px solid var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring.p{border-color:var(--line)}
.ring b{font-size:48px;font-variant-numeric:tabular-nums}
.peek{position:absolute;left:0;right:0;bottom:0;background:var(--gray);border-radius:20px 20px 0 0;padding:10px 20px 30px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;border:0;font:inherit;touch-action:none}
.peek .grab{width:36px;height:4px;border-radius:2px;background:var(--line)}
.pullbar{background:var(--blue);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:8px;cursor:pointer;border:0;font:inherit;width:100%;text-align:left}
.metrics{display:flex;gap:12px}.metrics>div{flex:1;min-width:0}.metrics b{display:block;font-size:30px;line-height:1.2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2>div{background:var(--gray);border-radius:12px;padding:12px}.grid2 b{display:block;font-size:18px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}.kv span{color:var(--mu)}.kv b{font-variant-numeric:tabular-nums}
.toast{position:absolute;left:20px;right:20px;top:64px;background:var(--fg);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;z-index:9}
.cover{width:120px;height:170px;border-radius:8px;background:var(--gray);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px;align-self:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:#fff;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
.phone{width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;border:0;border-radius:0;box-shadow:none}
@media (min-width:520px){body{background:var(--bg)}.phone{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.hdr{height:auto;min-height:52px;padding-top:env(safe-area-inset-top,0px)}
.hdr .menu{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;padding:6px 8px;color:var(--mu);cursor:pointer}
.bottom{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sheet{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.peek{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.timer{padding-top:calc(28px + env(safe-area-inset-top,0px))}
.pullbar{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.scroll{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
select,textarea{font-size:16px}
.toast{top:calc(64px + env(safe-area-inset-top,0px))}
.mlist{display:flex;flex-direction:column;gap:8px}
.mlist button{font:inherit;font-size:15px;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--fg)}
.mlist button.on{border-color:var(--blue);color:var(--blue);font-weight:700;background:var(--bs)}
</style>

<div class="phone" id="phone" aria-live="polite"></div>
<div id="sid" hidden></div>

<script>
const TOTAL=168, STARTS=[1,14,30,46,62,80,96,120,138,154];
const CONTENTS=[
 {id:'c0',k:'강의',m:4,t:'메이저 영감은 무슨 꿈을 꾸었을까?',at:13},
 {id:'c1',k:'생각 고르기',m:2,t:'나폴레옹과 스노볼, 누가 더 믿음직해?',at:29},
 {id:'c2',k:'기억 게임',m:3,t:'헛간 벽에 뭐라고 써 있었지?',at:45},
 {id:'c3',k:'되짚기 영상',m:2,t:'스노볼은 왜 쫓겨났을까?',at:79},
 {id:'c4',k:'생각 고르기',m:2,t:'돼지들만 우유와 사과를 먹어도 될까?',at:95},
 {id:'c5',k:'강의',m:4,t:'풍차는 왜 중요했을까?',at:119},
 {id:'c6',k:'생각 고르기',m:2,t:'무너진 풍차, 누구의 짓일까?',at:137},
 {id:'c7',k:'되짚기 영상',m:2,t:'복서를 실어 간 차에는 무슨 글씨가?',at:153},
 {id:'c8',k:'생각 고르기',m:2,t:'마지막 장면, 누가 돼지고 누가 사람일까?',at:168}];
const TEASE={1:'늙은 수퇘지 메이저가 동물들을 모아 놓고 이상한 꿈 이야기를 꺼내요.',2:'주인 존스를 몰아낸 날, 동물들이 가장 먼저 한 일은 뭘까요?',3:'모두 땀 흘려 일하는데, 돼지들만 일하지 않는 데는 이유가 있대요.',4:'외양간에서 큰 싸움이 벌어져요. 누가 영웅이 될까요?',5:'스노볼과 나폴레옹이 풍차를 두고 정면으로 부딪쳐요. 이긴 쪽은?',6:'돼지들이 갑자기 침대에서 자기 시작했어요. 계명은 괜찮을까요?',7:'애써 세운 풍차가 하룻밤 사이에 무너졌어요. 나폴레옹은 누구를 범인으로 지목할까요?',8:'7계명 중 하나에 슬쩍 두 단어가 더해져요. 무엇이 바뀌었을까요?',9:'복서를 태운 차 옆면에 적힌 글씨, 벤저민만 그 뜻을 알아챘어요.',10:'창문 너머로 본 얼굴들, 누가 돼지이고 누가 사람일까요?'};
const KNOW=[
 {k:'인물',t:'나폴레옹',d:'농장을 차지해 가는 돼지',at:0},{k:'인물',t:'스노볼',d:'풍차를 설계한 돼지',at:0},
 {k:'배경지식',t:'7계명과 그 변화',d:'읽은 곳까지 바뀐 문구',at:40},{k:'낱말',t:'선전',d:'생각을 퍼뜨리려는 말과 활동',at:60},
 {k:'배경지식',t:'풍차 전투',d:'두 번째 풍차를 둘러싼 싸움',at:119},{k:'인물',t:'복서의 마지막',d:'성실한 말 복서에게 일어난 일',at:153}];
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
let FAST=false;try{FAST=localStorage.getItem('chaekbeot-fast')==='1'}catch(e){}
const fmtD=d=>`${d.getMonth()+1}월 ${d.getDate()}일`;
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const addD=(n)=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return d};
const chOf=p=>{let c=0;STARTS.forEach((s,i)=>{if(p>=s)c=i+1});return c};
const chDone=p=>p>=TOTAL?10:Math.max(0,chOf(p)-1);
const mins=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)}시간 ${String(m%60).padStart(2,'0')}분`:`${m}분`};
const clock=s=>{s=Math.floor(s);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
let S;
function scenario(n){
  const base={tab:'info',page:0,round:1,completions:[],log:[],done:new Set(),seenKnow:new Set(),goal:null,started:false,reviews:[
    {n:'책읽는고래',p:96,t:'복서가 너무 성실해서 오히려 마음이 아팠어요. 열심히 일하면 정말 나아질까요?'},
    {n:'푸른연필',p:62,t:'7계명이 조금씩 바뀌는 게 소름 돋았어요. 다들 눈치를 못 챘을까?'},
    {n:'달빛토끼',p:168,t:'마지막 장면에서 돼지와 사람의 얼굴이 구별되지 않는 장면이 오래 남아요.'}],
    screen:'home',overlay:null,timer:0,running:false,from:null,sessionStart:0,lastWrap:null,toast:null};
  const R=(d,from,to,m)=>({d:addD(d),type:'read',from,to,sec:m*60,round:1});
  const Cn=(d,id)=>({d:addD(d),type:'content',id});
  if(n==='mid'){Object.assign(base,{tab:'timeline',page:96,started:true,goal:addD(7),done:new Set(['c0','c1','c2','c3'])});
    base.log=[{d:addD(-7),type:'start',goal:addD(7),round:1},R(-7,0,14,18),Cn(-7,'c0'),R(-6,14,30,22),R(-5,30,46,0),Cn(-5,'c1'),Cn(-4,'c2'),
      R(-3,46,62,25),R(-2,62,72,12),R(-2,72,80,9),R(-1,80,88,16),Cn(-1,'c3'),R(0,88,96,20)];}
  if(n==='done'){Object.assign(base,{tab:'timeline',page:168,started:true,goal:addD(-2),done:new Set(['c0','c1','c2','c3','c4','c5','c6','c7'])});
    base.log=[{d:addD(-12),type:'start',goal:addD(-2),round:1},R(-12,0,30,34),Cn(-12,'c0'),Cn(-11,'c1'),R(-10,30,62,41),Cn(-10,'c2'),R(-8,62,96,38),Cn(-8,'c3'),Cn(-7,'c4'),
      R(-6,96,120,27),Cn(-6,'c5'),R(-5,120,138,22),Cn(-5,'c6'),R(-4,138,155,19),Cn(-4,'c7'),R(-3,155,168,15)];
    base.completions=[{d:addD(-3),days:10,count:6,sec:196*60,vsGoal:1,round:1}];base.log.push({d:addD(-3),type:'complete',ref:0});}
  S=base;stopTick();render();
  document.querySelectorAll('[data-sc]').forEach(b=>b.classList.toggle('on',b.dataset.sc===n));
}
let tick=null;
function startTick(){stopTick();tick=setInterval(()=>{const now=Date.now();if(!S.running){S.lastTs=null;return}if(S.lastTs)S.timer+=(now-S.lastTs)/1000*(FAST?60:1);S.lastTs=now;save();const el=document.getElementById('clk');if(el)el.textContent=clock(S.timer);const el2=document.getElementById('clk2');if(el2)el2.textContent=clock(S.timer)},1000)}
function stopTick(){if(tick)clearInterval(tick);tick=null}
const reads=()=>S.log.filter(l=>l.type==='read'&&l.round===undefined||l.type==='read');
const roundReads=()=>S.log.filter(l=>l.type==='read'&&(l.round||1)===S.round);
const unlocked=c=>S.page>=c.at||(S.round>1&&S.completions.length>0);
const openContents=()=>CONTENTS.filter(unlocked);
const knowOpen=k=>S.page>=k.at||(S.round>1&&S.completions.length>0)||S.seenKnow.has(k.t);
function bookSec(){return roundReads().reduce((a,l)=>a+l.sec,0)}
function sid(id){document.getElementById('sid').textContent=id}
function h(s){return s}
// ---------- render ----------
function render(){
  const P=document.getElementById('phone');let html='';let id='';
  if(S.screen==='home'){[html,id]=home()}
  else if(S.screen==='timer'){[html,id]=timer()}
  else if(S.screen==='wrap'){[html,id]=wrap()}
  else if(S.screen==='fwrap'){[html,id]=fwrap()}
  else if(S.screen==='fsum'){[html,id]=fsum()}
  else if(S.screen==='content'){[html,id]=content()}
  if(S.overlay){const [o,oid]=overlay();html+=o;id=oid}
  if(S.toast)html+=`<div class="toast">${S.toast}</div>`;
  P.innerHTML=html;sid(id);bind(P);save();if(P.querySelector('.rail')&&!S.overlay){const sc=P.querySelector('.scroll');if(sc&&S._scrolled!==S.screen+S.tab+(S.pull?1:0)+S.log.length){sc.scrollTop=sc.scrollHeight;S._scrolled=S.screen+S.tab+(S.pull?1:0)+S.log.length}}
}
function header(t,back=true){return `<div class="hdr">${back?'<button class="back" data-a="back" aria-label="뒤로">‹</button>':''}<span class="t">${t}</span><button class="menu" data-a="menu" aria-label="프로토타입 메뉴">⋯</button></div>`}
function tabsHtml(list,cur,act){return `<div class="tabs" role="tablist">${list.map(([k,l,n])=>`<button class="tab ${cur===k?'on':''}" data-a="${act}" data-v="${k}" role="tab">${l}${n?`<sup>${n}</sup>`:''}</button>`).join('')}</div>`}
function homeTabs(cur,act='tab'){const nk=KNOW.filter(k=>knowOpen(k)&&k.at>0&&!S.seenKnow.has('_v'+k.t)).length;return tabsHtml([['info','책 정보'],['timeline','타임라인'],['know','책 속 지식',nk||''],['rev','감상','N']],cur,act)}
function itemHtml(c,extra=''){const d=S.done.has(c.id);return `<button class="item" data-a="content" data-v="${c.id}"><span class="ic"></span><span class="grow" style="flex:1;min-width:0"><span class="k">${c.k} · ${d?'완료':c.m+'분'}</span><br><span class="tt">${c.t}</span></span>${extra}</button>`}
function progress(){const p=S.page,pct=Math.round(p/TOTAL*100);return `<div class="bar"><i style="width:${pct}%"></i></div>`}
function tlSub(c,label){const d=S.done.has(c.id);return `<button class="sub ${d?'':'todo'}" data-a="content" data-v="${c.id}"><span class="badge ${d?'ok':''}">${d?'✓':'열림'}</span><span style="flex:1;min-width:0"><span class="mu">${c.k} · ${label}${d?' · 했어요':''}</span><br><b style="font-weight:500">${c.t}</b></span></button>`}
function tlKnow(k){return `<div class="sub"><span class="badge">열림</span><span style="flex:1;min-width:0"><span class="mu">책 속 지식 · 이번에 열림</span><br><b style="font-weight:500">${k.t}</b></span></div>`}
function nodeHtml(kind,title,body,cls=''){return `<div class="node ${cls}"><span class="dt"></span><span class="nk">${kind}</span>${title?`<div class="nt">${title}</div>`:''}${body||''}</div>`}
function timelineBody(){
  const today=d=>dayKey(d)===dayKey(TODAY)?' (오늘)':'';
  let o='';
  if(!S.log.length){return `<div class="rail">${nodeHtml('지금','아직 읽은 곳이 없어요','<div class="mu">[읽기 시작]을 누르면 첫 기록이 여기에 쌓여요</div>','now')}</div>`}
  S.log.forEach(l=>{const day=fmtD(l.d)+today(l.d);
    if(l.type==='start')o+=l.round>1?nodeHtml(day,`<span class="chip s">${l.round}번째 읽기 시작</span>`,'','grey'):nodeHtml(day,'처음 읽기 시작',l.goal?`<div class="mu">목표일 ${fmtD(l.goal)}</div>`:'','grey');
    if(l.type==='read'){let b='';if((l.round||1)===1){CONTENTS.filter(c=>c.at>l.from&&c.at<=l.to).forEach(c=>b+=tlSub(c,'이번에 열림'));KNOW.filter(k=>k.at>0&&k.at>l.from&&k.at<=l.to).forEach(k=>b+=tlKnow(k))}
      o+=nodeHtml(`${day} · 읽기`,`${l.from} → ${l.to}쪽 · ${l.sec?mins(l.sec):'타이머 없이 기록'}`,b)}
    if(l.type==='content'){const c=CONTENTS.find(x=>x.id===l.id);o+=nodeHtml(`${day} · ${c.k}`,`${c.k==='되짚기 영상'?'영상을 봤어요':c.k==='강의'?'강의를 들었어요':c.k==='기억 게임'?'기억 게임을 했어요':'생각을 골랐어요'}`,`<button class="sub" data-a="content" data-v="${c.id}"><span class="badge ok">✓</span><span style="flex:1;min-width:0"><b style="font-weight:500">${c.t}</b><br><span class="mu">다시 보기</span></span></button>`,'okn')}
    if(l.type==='complete'){const c=S.completions[l.ref];o+=nodeHtml(`${day} · 완독`,`끝까지 읽었어요 (${c.round}번째)`,`<div class="card ok" style="padding:10px 12px">
      <div class="kv"><span>읽은 기간</span><b>${c.days}일</b></div><div class="kv"><span>읽은 횟수</span><b>${c.count}번</b></div><div class="kv"><span>전체 시간</span><b>${mins(c.sec)}</b></div>${c.vsGoal!==null?`<div class="kv"><span>목표일 대비</span><b>${c.vsGoal>=0?c.vsGoal+'일 먼저':(-c.vsGoal)+'일 늦게'}</b></div>`:''}</div>`,'okn')}
  });
  const todo=openContents().filter(c=>!S.done.has(c.id));const done=S.page>=TOTAL;
  const pct=Math.round(S.page/TOTAL*100);
  let nowB=`${progress()}<div class="row"><span class="mu grow">${S.page} / ${TOTAL}쪽 · ${pct}%</span>${S.goal&&S.round===1&&!done?`<span class="chip b">목표일 D-${Math.max(0,Math.round((S.goal-TODAY)/864e5))}</span>`:''}</div>`;
  if(todo.length)nowB+=`<div class="card blue" style="gap:8px;padding:12px"><b style="font-size:12px;color:var(--blue)">이어서 할 수 있어요 ${todo.length}</b>${todo.map(c=>{const ev=S.log.find(l=>l.type==='read'&&c.at>l.from&&c.at<=l.to);return tlSub(c,ev?fmtD(ev.d)+' 열림':'열림')}).join('')}</div>`;
  o+=nodeHtml('지금',done?'끝까지 읽었어요':`${S.page}쪽 · ${Math.max(1,chOf(S.page))}장 읽는 중${S.round>1?` · ${S.round}번째`:''}`,nowB,'now');
  const next=CONTENTS.find(c=>!unlocked(c));
  if(next&&!done){const ch=chOf(next.at);const cnt=CONTENTS.filter(c=>chOf(c.at)===ch).length+KNOW.filter(k=>k.at>0&&chOf(k.at)===ch).length;o+=nodeHtml('다음',`${ch}장에서는`,`<div class="card dash" style="padding:12px"><span style="color:var(--fg);font-weight:500">${TEASE[ch]}</span><span class="mu">${ch}장을 다 읽으면 콘텐츠·책 속 지식 ${cnt}개가 열려요</span></div>`,'next')}
  return `<div class="rail">${o}</div>`;
}
function knowBody(){const kf=S.kf||'전체';return `<div class="chips kf">${['전체','인물','배경지식','낱말'].map(x=>`<button class="${x===kf?'on':''}" data-a="kf" data-v="${x}">${x}</button>`).join('')}</div>`+KNOW.filter(k=>kf==='전체'||k.k===kf).map(k=>{const open=knowOpen(k);const it=`<span class="ic" style="background:${k.k==='인물'?'var(--or)':k.k==='낱말'?'var(--ok)':'var(--bs)'}"></span><span style="flex:1;min-width:0"><span class="k">${k.k}</span><br><span class="tt">${k.t}</span><br><span class="mu">${k.d}</span></span>`;
  return open?`<div class="item">${it}</div>`:`<div class="lockwrap" data-a="spoil" data-v="${k.t}" data-ch="${chOf(k.at)}" data-p="${k.at}" role="button" tabindex="0"><div class="item locked">${it}</div><span class="chip">${chOf(k.at)}장까지 읽으면</span></div>`}).join('')}
function revBody(){return `<div class="row"><span class="mu grow">같은 학교급 친구들의 감상 · 최신순</span><button class="link" data-a="ov" data-v="review" style="color:var(--blue);text-decoration:none;font-weight:700">+ 감상 남기기</button></div>`+S.reviews.map((r,i)=>{const ahead=r.p>S.page&&!r.mine&&!r.shown;const when=r.p>=TOTAL?'다 읽고':`${chOf(r.p)}장 읽을 때`;const c=`<div class="card"><div class="row"><b>${r.n}</b><span class="mu">${when}</span></div><div>${r.t}</div></div>`;
  return ahead?`<div data-a="spoilrev" data-v="${i}" role="button" tabindex="0" style="cursor:pointer"><div style="filter:blur(3px);opacity:.6">${c}</div><span class="mu" style="color:var(--blue);font-weight:700">내 진도보다 뒤에서 쓴 감상이에요 · 눌러서 보기</span></div>`:c}).join('')}
function home(){
  const done=S.page>=TOTAL;const main=done?`다시 읽기 (${S.completions.length+1}번째)`:'읽기 시작';
  const map={info:['R01',infoBody],timeline:[done?'R02b':'R02',timelineBody],know:['R03',knowBody],rev:['R04',revBody]};
  const [id,fn]=map[S.tab];
  return [header('동물농장')+homeTabs(S.tab)+`<div class="scroll">${fn()}</div><div class="bottom"><button class="btn" data-a="${done?'reread':'start'}">${main}</button>${done?'':'<button class="link" data-a="ov" data-v="pageonly">읽은 페이지만 입력</button>'}</div>`,id];
}
function infoBody(){return `<div class="cover">표지</div><div style="text-align:center"><div style="font-size:22px;font-weight:700">동물농장</div><div class="mu">조지 오웰 · 본문 ${TOTAL}쪽 · 10장 · 중1 추천</div></div><div class="row" style="justify-content:center"><span class="chip b">예고편 보기 · 43초</span><span class="chip">+ 내 서재에 담기</span></div><div class="card"><b style="font-size:13px">이런 이야기예요</b><div>농장의 동물들이 주인을 몰아내고 스스로 농장을 꾸려 가요. 모두가 평등하자던 약속은 어떻게 바뀌어 갈까요?</div></div>`}
function timer(){
  const pull=S.pull;const run=S.running;
  if(pull){return [`<button class="pullbar" data-a="unpull"><b class="grow" style="flex:1">읽는 중 <span id="clk2">${clock(S.timer)}</span></b><span style="font-size:12px">내리면 타이머로 ⌄</span></button>`+tabsHtml([['timeline','타임라인'],['know','책 속 지식'],['rev','감상']],S.ptab||'timeline','ptab')+`<div class="scroll">${(S.ptab||'timeline')==='timeline'?timelineBody()+'<div class="card or"><span style="font-size:12px;font-weight:500">콘텐츠를 열면 타이머가 잠시 멈추고, 끝나면 이어서 돌아요.</span></div>':(S.ptab==='know'?knowBody():revBody())}</div>`,'R06b']}
  return [`<div class="timer"><span class="chip b" style="font-size:13px;padding:6px 14px">동물농장 · ${S.page?`지난번 ${S.page}쪽부터`:'처음부터'}</span><div class="ring ${run?'':'p'}"><b id="clk">${clock(S.timer)}</b><span class="mu">${run?'읽는 중':'멈춤'}</span></div><button class="btn" data-a="pause">멈춤</button></div><button class="peek" data-a="pull" id="peek" aria-label="책 홈 끌어올리기"><span class="grab"></span><span class="row" style="gap:14px;font-weight:700;color:var(--mu);font-size:13px"><span>타임라인</span><span>책 속 지식</span><span>감상</span></span><span class="mu">위로 올려서 책 홈 보기</span></button>`,'R06'];
}
function nowCard(w,fill='blue'){return `<div class="card ${fill}"><span style="font-size:13px;font-weight:700;color:var(--blue)">방금 읽었어요</span><div class="metrics">${w.sec!==null?`<div><span class="mu">읽은 시간</span><b>${mins(w.sec)}</b></div>`:''}<div><span class="mu">읽은 쪽</span><b>${Math.max(0,w.to-w.from)}쪽</b><span class="mu">${w.from} → ${w.to}쪽</span></div></div></div>`}
function todayCard(){const t=S.log.filter(l=>l.type==='read'&&dayKey(l.d)===dayKey(TODAY));if(t.length<2)return '';const sec=t.reduce((a,l)=>a+l.sec,0),pg=t.reduce((a,l)=>a+Math.max(0,l.to-l.from),0);return `<div class="card" style="padding:12px"><span class="mu" style="font-weight:700">오늘 ${t.length}번 읽었어요</span><div class="kv"><span>오늘 읽은 시간 · 쪽</span><b>${mins(sec)} · ${pg}쪽</b></div></div>`}
function bookCard(){const pct=Math.round(S.page/TOTAL*100);return `<div style="display:flex;flex-direction:column;gap:6px"><b style="font-size:13px">이 책</b>${progress()}<div class="kv"><span>${S.page} / ${TOTAL}쪽</span><b>${pct}%</b></div>${S.page<TOTAL&&chDone(S.page)?`<div class="kv"><span>읽은 장</span><b>${chDone(S.page)}장까지</b></div>`:''}<div class="kv"><span>이 책을 읽은 시간</span><b>${mins(bookSec())}</b></div></div>`}
function wrap(){
  const w=S.lastWrap;const open=openContents();const fresh=open.filter(c=>!S.done.has(c.id)&&c.at>w.from&&c.at<=w.to),old=open.filter(c=>!S.done.has(c.id)&&!(c.at>w.from&&c.at<=w.to));
  const none=!fresh.length&&!old.length;const next=CONTENTS.find(c=>!unlocked(c));
  let o=nowCard(w)+todayCard()+bookCard();
  if(none){o+=`<div class="card ok"><span class="h">열린 콘텐츠를 다 했어요</span><span class="mu">${next?`${chOf(next.at)}장까지 읽으면 새 콘텐츠가 열려요.`:'이 책의 콘텐츠를 모두 했어요.'}</span></div>`}
  else{o+=`<span class="h">열린 콘텐츠</span>`+fresh.map(c=>itemHtml(c,'<span class="chip b">새로</span>')).join('')+old.map(c=>itemHtml(c)).join('')}
  const first=(fresh[0]||old[0]);
  const bt=none?`<button class="btn" data-a="gohome">책 홈으로</button>`:`<button class="btn" data-a="content" data-v="${first.id}">콘텐츠 하기</button><button class="btn sec" data-a="gohome">완료</button>`;
  return [header('오늘 읽기',false)+`<div class="scroll">${o}</div><div class="bottom">${bt}</div>`,none?'R09b':'R09'];
}
function fwrap(){
  const w=S.lastWrap;const todo=openContents().filter(c=>!S.done.has(c.id));
  let o=`<div style="font-size:26px;font-weight:700">끝까지 읽었어요</div><div class="mu">동물농장 · 본문 ${TOTAL}쪽</div>`+nowCard(w,'ok')+todayCard()+bookCard();
  if(todo.length)o+=`<span class="h">아직 안 본 콘텐츠 ${todo.length}</span><span class="mu">보고 싶은 것만 골라 보세요</span>`+todo.map(c=>itemHtml(c)).join('');
  return [`<div class="scroll" style="padding-top:calc(36px + env(safe-area-inset-top,0px))">${o}</div><div class="bottom"><button class="btn" data-a="fsum">완독 정리 보기</button></div>`,'R11'];
}
function fsum(){const c=S.completions[S.completions.length-1];
  return [header('완독 정리',false)+`<div class="scroll"><div class="row" style="gap:14px"><div style="width:64px;height:92px;border-radius:6px;background:var(--gray)"></div><div><div style="font-size:20px;font-weight:700">동물농장</div><div class="mu">${fmtD(c.d)}에 ${c.round>1?c.round+'번째로 ':''}다 읽었어요</div></div></div>
  <div class="grid2"><div><span class="mu">읽은 기간</span><b>${c.days}일</b></div><div><span class="mu">읽은 횟수</span><b>${c.count}번</b></div><div><span class="mu">전체 시간</span><b>${mins(c.sec)}</b></div><div><span class="mu">목표일 대비</span><b>${c.vsGoal===null?'목표일 없음':c.vsGoal>=0?c.vsGoal+'일 먼저':(-c.vsGoal)+'일 늦게'}</b></div></div>
  <span class="h">감상을 적어 보세요 (선택)</span><textarea id="revtxt" placeholder="가장 기억에 남는 장면이나 느낀 점을 자유롭게 적어 보세요. 남긴 감상은 감상 탭에서 친구들도 볼 수 있어요."></textarea></div>
  <div class="bottom"><button class="btn" data-a="saverev">남기기</button><button class="btn sec" data-a="gohome">책 홈으로</button></div>`,'R12'];}
function content(){const c=CONTENTS.find(x=>x.id===S.cid);
  return [header(c.k)+`<div class="scroll"><div class="card" style="min-height:360px;justify-content:center;align-items:center;text-align:center"><span class="k" style="color:var(--blue);font-weight:700;font-size:12px">${c.k} · ${c.m}분</span><span class="h">${c.t}</span><span class="mu">기존 콘텐츠 화면(생각 고르기·영상·강의·기억 게임)을 그대로 씁니다.</span></div>${S.from==='timer'?'<div class="card or"><span style="font-size:12px">타이머는 멈춰 있어요. 콘텐츠를 마치면 이어서 돌아요.</span></div>':''}</div><div class="bottom"><button class="btn" data-a="cdone">다 했어요</button></div>`,'R10'];}
function overlay(){const o=S.overlay;
  if(o==='goal'){const sel=S.gsel||10;return [`<div class="overlay"><div class="sheet"><span class="grab"></span><span class="h" style="font-size:18px">언제까지 다 읽어 볼까요?</span><div class="chips">${[7,10,14,21,30].map(d=>`<button class="${d===sel?'on':''}" data-a="gsel" data-v="${d}">${d}일</button>`).join('')}</div><span class="mu">${fmtD(addD(sel))}까지 · 하루 분량은 정하지 않아요</span><button class="btn" data-a="goalok">이 날까지 읽기</button><button class="btn sec" data-a="goalskip">건너뛰기</button></div></div>`,'R05']}
  if(o==='pause'){return [`<div class="overlay"><div class="sheet"><span class="grab"></span><span class="h" style="font-size:18px">잠깐 멈췄어요</span><span class="mu">지금까지 ${mins(S.timer)} 읽었어요</span><b style="font-size:13px">몇 쪽까지 읽었어요?</b><div class="inp"><input id="pg" type="number" inputmode="numeric" min="1" max="${TOTAL}" value="${S.page||''}" aria-label="읽은 쪽"><span class="mu">/ ${TOTAL}쪽</span></div><span class="mu">지난번 ${S.page}쪽 · 계속 읽을 땐 그대로 둬도 돼요</span><span class="mu" id="err" style="color:#c0392b"></span><button class="btn" data-a="endday">오늘은 끝</button><button class="btn sec" data-a="resume">계속 읽기</button></div></div>`,'R07']}
  if(o==='pageonly'){return [`<div class="overlay"><div class="sheet"><span class="grab"></span><div class="row"><span class="h grow" style="font-size:18px">읽은 페이지만 입력</span><button class="link" data-a="close" style="text-decoration:none">닫기</button></div><span class="mu">타이머 없이 읽었을 때 어디까지 읽었는지 남겨요.</span><b style="font-size:13px">몇 쪽까지 읽었어요?</b><div class="inp"><input id="pg" type="number" inputmode="numeric" min="1" max="${TOTAL}" value="${S.page||''}" aria-label="읽은 쪽"><span class="mu">/ ${TOTAL}쪽</span></div><label class="mu" for="dsel">읽은 날</label><select id="dsel">${[0,-1,-2,-3,-4,-5,-6].map(n=>`<option value="${n}">${fmtD(addD(n))}${n===0?' (오늘)':''}</option>`).join('')}</select><span class="mu">최근 7일 안에서 바꿀 수 있어요</span><span class="mu" id="err" style="color:#c0392b"></span><button class="btn" data-a="pagesave">기록하기</button></div></div>`,'R08']}
  if(o==='back'){return [`<div class="overlay center"><div class="dialog"><span class="h" style="font-size:18px">지난번 ${S.page}쪽보다 앞이에요</span><span class="mu" style="font-size:14px">${S.pend.to}쪽으로 기록할까요? 앞부분을 다시 읽었다면 그대로 기록해도 돼요.</span><button class="btn" data-a="backok">이대로 기록</button><button class="btn sec" data-a="backno">다시 입력</button></div></div>`,'R07b']}
  if(o==='spoil'){return [`<div class="overlay center"><div class="dialog"><span class="h" style="font-size:18px">스포일러가 있어요</span><span class="mu" style="font-size:14px">「${S.spoil.t}」는 ${S.spoil.ch}장(${S.spoil.p}쪽)까지 읽고 보면 더 재밌어요.</span><button class="btn" data-a="close">나중에 볼게요</button><button class="btn sec" data-a="spoilok">그래도 볼래요</button></div></div>`,'R03b']}
  if(o==='review'){return [`<div class="overlay"><div class="sheet"><span class="grab"></span><span class="h" style="font-size:18px">감상 남기기</span><textarea id="revtxt2" placeholder="읽으면서 든 생각을 자유롭게 적어 보세요."></textarea><button class="btn" data-a="revpost">올리기</button><button class="btn sec" data-a="close">닫기</button></div></div>`,'R04 감상 쓰기']}
  if(o==='menu'){const sc=[['new','처음 읽는 책'],['mid','읽는 중 (96쪽 · 8일째)'],['done','다 읽은 책']];return [`<div class="overlay"><div class="sheet"><span class="grab"></span><div class="row"><span class="h grow" style="font-size:18px">프로토타입 메뉴</span><button class="link" data-a="close" style="text-decoration:none">닫기</button></div><span class="mu">기록은 이 기기의 브라우저에만 저장돼요. 시작 상태를 바꾸면 기록이 처음으로 돌아가요.</span><b style="font-size:13px">시작 상태</b><div class="mlist">${sc.map(([k,l])=>`<button data-a="sc" data-v="${k}">${l}</button>`).join('')}</div><b style="font-size:13px">시연 도구</b><div class="mlist"><button class="${FAST?'on':''}" data-a="fast">타이머 빨리 감기 (1초 = 1분) · ${FAST?'켜짐':'꺼짐'}</button></div></div></div>`,'메뉴']}
  return ['',''];
}
// ---------- actions ----------
function toast(s){S.toast=s;render();setTimeout(()=>{S.toast=null;const t=document.querySelector('.toast');if(t)t.remove()},1800)}
function startTimer(){S.screen='timer';S.overlay=null;S.timer=0;S.running=true;S.pull=false;S.sessionFrom=S.page;startTick();render()}
function commit(to,sec,date){
  const from=S.sessionFrom??S.page;const d=date||TODAY;
  S.log.push({d,type:'read',from,to,sec:sec||0,round:S.round});S.started=true;
  S.lastWrap={from,to,sec:sec===null?null:sec};S.page=to;S.running=false;stopTick();S.overlay=null;S.pend=null;
  if(to>=TOTAL){const rr=roundReads();const first=S.log.find(l=>l.type==='start'&&(l.round||1)===S.round);const startD=first?first.d:rr[0].d;
    const days=Math.round((d-startD)/864e5)+1;const vs=S.goal&&S.round===1?Math.round((S.goal-d)/864e5):null;
    S.completions.push({d,days,count:rr.length,sec:rr.reduce((a,l)=>a+l.sec,0),vsGoal:vs,round:S.round});S.log.push({d,type:'complete',ref:S.completions.length-1});S.screen='fwrap'}
  else S.screen='wrap';
  render();
}
function readPage(){const v=parseInt(document.getElementById('pg').value,10);const e=document.getElementById('err');
  if(!v||v<1){e.textContent='읽은 쪽을 입력해 주세요';return null}if(v>TOTAL){e.textContent=`이 책은 ${TOTAL}쪽까지예요`;return null}return v}
const A={
 noop(){},
 back(){if(S.screen==='content'){const f=S.from;S.screen=f==='timer'?'timer':f;if(f==='timer'){S.running=true;S.lastTs=Date.now()}render()}},
 menu(){S.overlay='menu';render()},
 sc(v){scenario(v);toast('시작 상태를 바꿨어요')},
 fast(){FAST=!FAST;try{localStorage.setItem('chaekbeot-fast',FAST?'1':'0')}catch(e){}render()},
 kf(v){S.kf=v;render()},
 tab(v){S.tab=v;if(v==='know')KNOW.filter(knowOpen).forEach(k=>S.seenKnow.add('_v'+k.t));render()},
 ptab(v){S.ptab=v;render()},
 start(){if(!S.started&&S.round===1&&!S.log.some(l=>l.type==='start')){S.overlay='goal';S.gsel=10;render()}else startTimer()},
 gsel(v){S.gsel=+v;render()},
 goalok(){S.goal=addD(S.gsel);S.log.push({d:TODAY,type:'start',goal:S.goal,round:1});startTimer()},
 goalskip(){S.log.push({d:TODAY,type:'start',goal:null,round:1});startTimer()},
 reread(){S.round=S.completions.length+1;S.page=0;S.log.push({d:TODAY,type:'start',round:S.round});startTimer()},
 pull(){S.pull=true;render()},unpull(){S.pull=false;render()},
 pause(){S.running=false;S.overlay='pause';render()},
 resume(){const v=parseInt(document.getElementById('pg').value,10);if(v&&v<=TOTAL&&v>=S.page)S.page=v;S.overlay=null;S.running=true;render()},
 endday(){const v=readPage();if(v===null)return;if(v<S.page){S.pend={to:v,sec:S.timer,timer:true};S.overlay='back';render();return}commit(v,S.timer)},
 pagesave(){const v=readPage();if(v===null)return;const d=addD(parseInt(document.getElementById('dsel').value,10));S.sessionFrom=S.page;if(v<S.page){S.pend={to:v,sec:null,d};S.overlay='back';render();return}commit(v,null,d)},
 backok(){const p=S.pend;commit(p.to,p.sec,p.d)},
 backno(){S.overlay=S.pend&&S.pend.timer?'pause':'pageonly';S.pend=null;render()},
 content(v){S.from=S.screen==='timer'?'timer':S.screen;if(S.from==='timer'){S.running=false}S.cid=v;S.screen='content';S.overlay=null;render()},
 cdone(){if(!S.done.has(S.cid))S.log.push({d:TODAY,type:'content',id:S.cid});S.done.add(S.cid);const f=S.from;if(f==='timer'){S.screen='timer';S.pull=false;S.running=true;render();toast('타이머가 다시 돌아요')}else if(f==='home'){S.screen='home';render()}else{S.screen=f;render()}},
 gohome(){S.screen='home';S.tab='timeline';S.sessionFrom=null;render()},
 fsum(){S.screen='fsum';render()},
 saverev(){const t=document.getElementById('revtxt').value.trim();if(t)S.reviews.unshift({n:'나',p:TOTAL,t,mine:true});A.gohome();if(t)toast('감상을 남겼어요')},
 revpost(){const t=document.getElementById('revtxt2').value.trim();if(!t)return;S.reviews.unshift({n:'나',p:S.page,t,mine:true});S.overlay=null;render();toast('감상을 올렸어요')},
 spoil(v,el){S.spoil={t:v,ch:el.dataset.ch,p:el.dataset.p};S.overlay='spoil';render()},
 spoilok(){S.seenKnow.add(S.spoil.t);S.overlay=null;render()},
 spoilrev(v){S.reviews[+v].shown=true;render()},
 ov(v){S.sessionFrom=S.page;S.overlay=v;render()},
 close(){S.overlay=null;render()}
};
function bind(P){P.querySelectorAll('[data-a]').forEach(el=>{const go=e=>{e.preventDefault();A[el.dataset.a](el.dataset.v,el)};el.addEventListener('click',go);if(el.getAttribute('role')==='button')el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go(e)})});
  const pk=document.getElementById('peek');if(pk){let y0=null;pk.addEventListener('pointerdown',e=>{y0=e.clientY});pk.addEventListener('pointerup',e=>{if(y0!==null&&y0-e.clientY>20){A.pull()}y0=null})}}
function save(){try{localStorage.setItem('chaekbeot-proto',JSON.stringify(S,(k,v)=>v instanceof Set?{__set:[...v]}:(k==='toast'||k==='_scrolled')?undefined:v))}catch(e){}}
function load(){try{const t=localStorage.getItem('chaekbeot-proto');if(!t)return null;return JSON.parse(t,(k,v)=>v&&v.__set?new Set(v.__set):(typeof v==='string'&&/^\d{4}-\d\d-\d\dT/.test(v))?new Date(v):v)}catch(e){return null}}
(function init(){const s=load();if(s&&s.screen){S=s;S.toast=null;render();if(S.screen==='timer')startTick()}else scenario('mid')})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&S.running){const el=document.getElementById('clk');if(el)el.textContent=clock(S.timer)}});
</script>
