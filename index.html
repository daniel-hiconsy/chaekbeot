  if(o==='goal'){const sel=S.gsel||10;return [`<div class="overlay"><div class="sheet"><span class="grab"></span><span class="h" style="font-size:18px">언제까지 다 읽어 볼까요?</span><div class="chips">${[7,10,14,21,30].map(d=>`<button class="${d===sel?'on':''}" data-a="gsel" data-v="${d}">${d}일</button>`).join('')}</div><span class="mu">${fmtD(addD(sel))}까지 · 하루 분량은 정하지 않아요</span><button class="btn" data-a="goalok">이 날까지 읽기</button><button class="btn sec" data-a="goalskip">건너뛰기</button></div></div>`,'R05']}

  if(o==='endpage'){return [`<div class="overlay"><div class="sheet"><span class="grab"></span><span class="h" style="font-size:18px">몇 쪽까지 읽었어요?</span><span class="mu">오늘 ${mins(S.timer)} 읽었어요 · 지난번 ${S.page}쪽</span><div class="inp"><input id="pg" type="number" inputmode="numeric" min="1" max="${TOTAL}" value="" placeholder="${S.page||''}" aria-label="읽은 쪽"><span class="mu">/ ${TOTAL}쪽</span></div><span class="mu" id="err" style="color:#c0392b"></span><button class="btn" data-a="endday">기록하기</button><button class="btn sec" data-a="close">취소</button></div></div>`,'R07a 읽은 쪽 입력']}
  if(o==='pageonly'){return [`<div class="overlay"><div class="sheet"><span class="grab"></span><div class="row"><span class="h grow" style="font-size:18px">${plabel()}</span><button class="link" data-a="close" style="text-decoration:none">닫기</button></div><span class="mu">타이머 없이 읽은 부분의 페이지를 입력해주세요.</span><div class="inp"><input id="pg" type="number" inputmode="numeric" min="1" max="${TOTAL}" value="${S.page||''}" aria-label="읽은 쪽"><span class="mu">/ ${TOTAL}쪽</span></div><label class="mu" for="dsel">읽은 날</label><select id="dsel">${[0,-1,-2,-3,-4,-5,-6].map(n=>`<option value="${n}">${fmtD(addD(n))}${n===0?' (오늘)':''}</option>`).join('')}</select><span class="mu">최근 7일 안에서 바꿀 수 있어요</span><span class="mu" id="err" style="color:#c0392b"></span><button class="btn" data-a="pagesave">기록하기</button></div></div>`,'R08']}
  if(o==='back'){return [`<div class="overlay center"><div class="dialog"><span class="h" style="font-size:18px">지난번 ${S.page}쪽보다 앞이에요</span><span class="mu" style="font-size:14px">${S.pend.to}쪽으로 기록할까요? 앞부분을 다시 읽었다면 그대로 기록해도 돼요.</span><button class="btn" data-a="backok">이대로 기록</button><button class="btn sec" data-a="backno">다시 입력</button></div></div>`,'R07b']}
  if(o==='spoil'){return [`<div class="overlay center"><div class="dialog"><span class="h" style="font-size:18px">스포일러가 있어요</span><span class="mu" style="font-size:14px">${S.spoil.st?'다음 모습은 조금 더 읽고 보면 더 재밌어요.':`「${S.spoil.t}」는 ${S.spoil.ch}장(${S.spoil.p}쪽)까지 읽고 보면 더 재밌어요.`}</span><button class="btn" data-a="close">나중에 볼게요</button><button class="btn sec" data-a="spoilok">그래도 볼래요</button></div></div>`,'R03b']}
  if(o==='review'){return [`<div class="overlay"><div class="sheet"><span class="grab"></span><span class="h" style="font-size:18px">감상 남기기</span><textarea id="revtxt2" placeholder="읽으면서 든 생각을 자유롭게 적어 보세요."></textarea><button class="btn" data-a="revpost">올리기</button><button class="btn sec" data-a="close">닫기</button></div></div>`,'R04 감상 쓰기']}
  if(o==='revask'){return [`<div class="overlay"><div class="sheet"><span class="grab"></span><span class="h" style="font-size:18px">감상을 남기지 않았어요</span><span class="mu" style="font-size:14px">읽은 느낌이 남아 있을 때 짧게라도 적어 볼까요?</span><textarea id="revtxt3" placeholder="가장 기억에 남는 장면이나 느낀 점을 자유롭게 적어 보세요.">${(S.revDraft||'').replace(/</g,'&lt;')}</textarea><span class="mu" id="err3" style="color:#c0392b"></span><button class="btn" data-a="revaskpost">감상 남기기</button><button class="btn sec" data-a="revasklater">다음에 남기기</button></div></div>`,'R12b 감상 확인']}
  if(o==='menu'){const sc=[['new','처음 읽는 책'],['mid','읽는 중 (96쪽 · 8일째)'],['done','다 읽은 책']];return [`<div class="overlay"><div class="sheet"><span class="grab"></span><div class="row"><span class="h grow" style="font-size:18px">프로토타입 메뉴</span><button class="link" data-a="close" style="text-decoration:none">닫기</button></div><span class="mu">기록은 이 기기의 브라우저에만 저장돼요. 시작 상태를 바꾸면 기록이 처음으로 돌아가요.</span><b style="font-size:13px">시작 상태</b><div class="mlist">${sc.map(([k,l])=>`<button data-a="sc" data-v="${k}">${l}</button>`).join('')}</div><b style="font-size:13px">책 속 지식 · 다음 변화 힌트</b><div class="mlist">${[['item','항목별 (기본 B안 · 나폴레옹만 기획자가 A안 선택)'],['A','모두 A안 · 힌트 없음'],['B','모두 B안 · 흐림 힌트']].map(([v,l])=>`<button class="${(S.hintMode||'item')===v?'on':''}" data-a="hint" data-v="${v}">${l}</button>`).join('')}</div><b style="font-size:13px">시연 도구</b><div class="mlist"><button class="${FAST?'on':''}" data-a="fast">타이머 빨리 감기 (1초 = 1분) · ${FAST?'켜짐':'꺼짐'}</button></div></div></div>`,'메뉴']}
  return ['',''];
}
// ---------- actions ----------
function toast(s){S.toast=s;render();setTimeout(()=>{S.toast=null;const t=document.querySelector('.toast');if(t)t.remove()},1800)}
function startTimer(){S.screen='timer';S.overlay=null;S.timer=0;S.running=true;S.pull=false;S.sessionFrom=S.page;startTick();render()}
function commit(to,sec,date){
  const from=S.sessionFrom??S.page;const d=date||TODAY;
  S.log.push({d,type:'read',from,to,sec:sec||0,man:sec===null||sec===undefined,round:S.round});S.started=true;
  S.lastWrap={from,to,sec:sec===null?null:sec};S.page=to;S.running=false;stopTick();S.overlay=null;S.pend=null;
  if(to>=TOTAL){const rr=roundReads();const first=S.log.find(l=>l.type==='start'&&(l.round||1)===S.round);const startD=first?first.d:rr[0].d;
    const days=Math.round((d-startD)/864e5)+1;const vs=S.goal&&S.round===1?Math.round((S.goal-d)/864e5):null;
    S.completions.push({d,days,count:rr.length,sec:rr.reduce((a,l)=>a+l.sec,0),vsGoal:vs,round:S.round});S.log.push({d,type:'complete',ref:S.completions.length-1});S.screen='fwrap'}
  else S.screen='wrap';
  render();
}
function readPage(){const v=parseInt(document.getElementById('pg').value,10);const e=document.getElementById('err');
  if(!v||v<1){e.textContent='읽은 쪽을 입력해 주세요';return null}if(v>TOTAL){e.textContent=`이 책은 ${TOTAL}쪽까지예요`;return null}return v}
const A={
 noop(){},
 back(){if(S.screen==='kd'){A.kback();return}if(S.screen==='fsum'&&S.fview!=null){A.fback();return}if(S.screen==='content'){const f=S.from;S.screen=f==='timer'?'timer':f;if(f==='home'&&S.retTodo){S.overlay='todo';S.retTodo=false}if(f==='timer'){S.running=true;S.lastTs=Date.now()}render()}},
 menu(){S.overlay='menu';render()},
 sc(v){scenario(v);toast('시작 상태를 바꿨어요')},
 fast(){FAST=!FAST;try{localStorage.setItem('chaekbeot-fast',FAST?'1':'0')}catch(e){}render()},
 kf(v){S.kf=v;render()},
 kd(v){S.kid=v;S.screen='kd';if(S.kstage)delete S.kstage[v];render()},
 kst(v){if(!S.kstage)S.kstage={};S.kstage[S.kid]=+v;render()},
 kback(){S.screen='home';S.tab='know';render()},
 spoilst(v,el){S.spoil={t:'다음 변화',ch:el.dataset.ch,p:el.dataset.p,st:v};S.overlay='spoil';render()},
 hint(v){S.hintMode=v;S.overlay=null;render();toast('힌트 방식을 바꿨어요')},
 tab(v){S.tab=v;if(v==='know')KNOW.filter(knowOpen).forEach(k=>S.seenKnow.add('_v'+k.t));render()},
 ptab(v){S.ptab=v;render()},
 pl(v){S.pl=+v;S.overlay=null;render();toast('문구를 바꿨어요')},
 start(){if(!S.log.some(l=>l.type==='start'&&(l.round||1)===S.round))S.log.push({d:TODAY,type:'start',round:S.round});startTimer()},
 trailer(){S.screen='trailer';S.tend=false;render();clearTimeout(window.__tr);window.__tr=setTimeout(()=>{if(S.screen==='trailer'){S.tend=true;render()}},6000)},
 tskip(){clearTimeout(window.__tr);S.tend=true;render()},
 tclose(){clearTimeout(window.__tr);S.screen='home';render()},
 tstart(){clearTimeout(window.__tr);S.screen='home';A.start()},
 revpost2(){const t=document.getElementById('revtxt').value.trim();if(!t)return;S.reviews.unshift({n:'나',p:TOTAL,t,mine:true});S.revDone=t;render();toast('감상을 남겼어요')},
 praise(){if(!S.revDone){const t=document.getElementById('revtxt');S.revDraft=t?t.value:'';S.overlay='revask';render();return}S.revDone=null;A.gohome();toast('완독을 축하해요!')},
 revaskpost(){const t=document.getElementById('revtxt3').value.trim();if(!t){document.getElementById('err3').textContent='감상을 적어 주세요';return}S.reviews.unshift({n:'나',p:TOTAL,t,mine:true});S.revDone=null;S.revDraft='';S.overlay=null;A.gohome();toast('감상을 남기고 완독을 마쳤어요!')},
 revasklater(){S.revDone=null;S.revDraft='';S.overlay=null;A.gohome();toast('완독을 축하해요!')},
 recap(){S.from='fsum';S.cid='recap';S.screen='content';render()},
 gsel(v){S.gsel=+v;render()},
 goalok(){S.goal=addD(S.gsel);S.log.push({d:TODAY,type:'start',goal:S.goal,round:1});startTimer()},
 goalskip(){S.log.push({d:TODAY,type:'start',goal:null,round:1});startTimer()},
 reread(){S.round=S.completions.length+1;S.page=0;S.log.push({d:TODAY,type:'start',round:S.round});startTimer()},
 pull(){S.pull=true;render()},unpull(){S.pull=false;render()},
 pause(){S.running=false;S.lastTs=null;render()},
 resume(){S.overlay=null;S.running=true;S.lastTs=Date.now();render()},
 stop(){S.overlay='endpage';render()},
 endday(){const v=readPage();if(v===null)return;if(v<S.page){S.pend={to:v,sec:S.timer,timer:true};S.overlay='back';render();return}commit(v,S.timer)},
 pagesave(){const v=readPage();if(v===null)return;const d=addD(parseInt(document.getElementById('dsel').value,10));S.sessionFrom=S.page;if(v<S.page){S.pend={to:v,sec:null,d};S.overlay='back';render();return}commit(v,null,d)},
 backok(){const p=S.pend;commit(p.to,p.sec,p.d)},
 backno(){S.overlay=S.pend&&S.pend.timer?'endpage':'pageonly';S.pend=null;render()},
 content(v){S.retTodo=S.overlay==='todo';S.from=S.screen==='timer'?'timer':S.screen;if(S.from==='timer'){S.running=false}S.cid=v;S.screen='content';S.overlay=null;render()},
 cdone(){if(!S.done.has(S.cid))S.log.push({d:TODAY,type:'content',id:S.cid});S.done.add(S.cid);const f=S.from;if(f==='timer'){S.screen='timer';S.pull=false;S.running=true;render();toast('타이머가 다시 돌아요')}else if(f==='home'){S.screen='home';if(S.retTodo&&todoList().length)S.overlay='todo';S.retTodo=false;render()}else{S.screen=f;render()}},
 gohome(){S.screen='home';S.tab='timeline';S.sessionFrom=null;render()},
 fsum(){S.fview=null;S.screen='fsum';render()},
 tlday(v){if(!(S.tlOpen instanceof Set))S.tlOpen=new Set();S.tlOpen.has(v)?S.tlOpen.delete(v):S.tlOpen.add(v);render()},
 tlsum(v){S.fview=+v;S.screen='fsum';render()},
 fback(){S.fview=null;S.screen='home';S.tab='timeline';render()},
 saverev(){const t=document.getElementById('revtxt').value.trim();if(t)S.reviews.unshift({n:'나',p:TOTAL,t,mine:true});A.gohome();if(t)toast('감상을 남겼어요')},
 revpost(){const t=document.getElementById('revtxt2').value.trim();if(!t)return;S.reviews.unshift({n:'나',p:S.page,t,mine:true});S.overlay=null;render();toast('감상을 올렸어요')},
 spoil(v,el){S.spoil={t:v,ch:el.dataset.ch,p:el.dataset.p};S.overlay='spoil';render()},
 spoilok(){if(S.spoil.st){if(!(S.peek instanceof Set))S.peek=new Set();S.peek.add(S.spoil.st);if(S.kstage)delete S.kstage[S.kid]}else S.seenKnow.add(S.spoil.t);S.overlay=null;render()},
 spoilrev(v){S.reviews[+v].shown=true;render()},
 ov(v){S.sessionFrom=S.page;S.overlay=v;render()},
 close(){S.overlay=null;render()}
};
function bind(P){P.querySelectorAll('[data-a]').forEach(el=>{const go=e=>{e.preventDefault();A[el.dataset.a](el.dataset.v,el)};el.addEventListener('click',go);if(el.getAttribute('role')==='button')el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go(e)})});
  const pk=document.getElementById('peek');if(pk){let y0=null;pk.addEventListener('pointerdown',e=>{y0=e.clientY});pk.addEventListener('pointerup',e=>{if(y0!==null&&y0-e.clientY>20){A.pull()}y0=null})}}
function save(){try{localStorage.setItem('chaekbeot-proto',JSON.stringify(S,(k,v)=>v instanceof Set?{__set:[...v]}:(k==='toast'||k==='_scrolled'||k==='_sk'||k==='tlOpen'||k==='tlAuto'||k==='tlLatest')?undefined:v))}catch(e){}}
function load(){try{const t=localStorage.getItem('chaekbeot-proto');if(!t)return null;return JSON.parse(t,(k,v)=>v&&v.__set?new Set(v.__set):(typeof v==='string'&&/^\d{4}-\d\d-\d\dT/.test(v))?new Date(v):v)}catch(e){return null}}
(function init(){const s=load();if(s&&s.screen){S=s;S.toast=null;render();if(S.screen==='timer')startTick()}else scenario('mid')})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&S.running){const el=document.getElementById('clk');if(el)el.textContent=clock(S.timer)}});
</script>

</body></html>
